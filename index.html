<title>Lokacije skladišča</title>
<style>
:root{--bg:#0d1320;--card:#151d2c;--ink:#e6edf7;--mut:#8b9ab1;--line:#253147;--acc:#3b8cff;--blue:#6fb3ff;--acc2:#12233d;--full:#14284a;--fullb:#4da3ff;--red:#ff6b6b;--hit:#1f3d6e;--green:#3ddc97;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
h1{font-size:20px;margin:0;flex:1;color:var(--blue);display:flex;align-items:center;gap:8px}
h1 img{height:30px;width:auto;border-radius:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 11px;font-size:14px;display:flex;align-items:center;gap:6px;max-width:55%}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#999;display:inline-block;flex:none}
.dot.on{background:#27ae60}.dot.err{background:var(--red)}.dot.wait{background:#e6a817}
.sum{font-size:13px;color:var(--mut);margin-top:6px}
.srow{display:flex;gap:8px;margin-top:8px}
.search{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.kb{width:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px}
main{padding:6px 12px calc(110px + env(safe-area-inset-bottom))}
.grp{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.gh{font-size:13px;font-weight:700;color:var(--blue);margin:12px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 8px;min-height:78px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.tile .n{font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:4px;flex-wrap:wrap}
.tile .n small{font-weight:600;font-size:11px;color:var(--mut)}
.tile .f{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.full{background:var(--full);border-left:4px solid var(--fullb)}
.tile.over{border-left-color:var(--red)}.over .n small{color:var(--red);font-weight:800}
.tile.dim{opacity:.25}.tile.hit{outline:3px solid #ffd166}
.tile.sp{grid-column:span 2}
.tile .n{color:var(--blue)}
#sres{max-height:32vh;overflow:auto}#sres:empty{display:none}
.sr{padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}.sr .tt{color:var(--blue);font-weight:700}
.lc{border:1px solid var(--line);background:var(--acc2);color:var(--ink);border-radius:16px;padding:5px 10px;margin:4px 4px 0 0;font-size:14px}.lc b{color:var(--blue)}
select.in option{background:var(--card)}
.tile.flash{animation:fl 1.2s}
@keyframes fl{0%{background:var(--hit)}100%{}}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.bb{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);gap:2px;min-width:60px}
.bb span{font-size:21px}.bb i{font-style:normal}
.mic{width:68px;height:68px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;margin-top:-30px;box-shadow:0 4px 14px rgba(0,0,0,.25);flex:none}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.ov[hidden]{display:none}
.ov.solid{background:var(--bg)}
.sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 10px;font-size:20px;color:var(--blue)}
.sheet h3{margin:18px 0 6px;font-size:16px;color:var(--blue)}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.row .nm{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.cnt{min-width:30px;text-align:center;font-weight:700;font-size:18px}
.sq{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:19px;flex:none}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;margin-top:10px}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.d{color:var(--red)}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.in{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.add{display:flex;gap:8px;margin-top:10px;align-items:center}.add .in{flex:1}.add .in.num{width:74px;flex:none;text-align:center}
.mut{color:var(--mut);font-size:13px}
.big{font-size:22px;font-weight:700;margin:6px 0}
.card{background:var(--acc2);border-radius:14px;padding:14px;margin:10px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}.stat b{display:block;font-size:24px}
.ft{width:100%;border-collapse:collapse;font-size:14px}.ft td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}.ft td:nth-child(2){text-align:right;font-weight:700;white-space:nowrap;font-size:18px}
.ft tr{cursor:pointer}
.hist div{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.plus{color:var(--green);font-weight:700}.mv{color:var(--blue);font-weight:700}.minus{color:var(--red);font-weight:700}
label{display:block;font-weight:600;margin:14px 0 4px;color:var(--blue)}
textarea.in{min-height:90px}
pre.rep{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;font:13px/1.4 ui-monospace,Menlo,monospace;max-height:45vh;overflow:auto}
.listen{text-align:center;padding:20px 0}
.pulse{width:110px;height:110px;border-radius:50%;background:var(--acc);margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;animation:pu 1.2s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(59,140,255,.6)}100%{box-shadow:0 0 0 30px rgba(59,140,255,0)}}
.lang{display:flex;gap:8px;justify-content:center;margin-bottom:12px}.lang button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 14px}.lang button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.err{color:var(--red);font-weight:600;margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:#2a3a57;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90%}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block;color:#000;font:12px Arial}#print table{border-collapse:collapse;width:100%}#print td,#print th{border:1px solid #999;padding:4px;text-align:left}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1><span id="logoBox">📦</span>Lokacije</h1>
    <button class="chip" id="meChip"><span class="dot" id="syncDot"></span><span id="meName">—</span></button>

  <div class="sum" id="sum"></div>
  <div class="srow"><input class="search" id="search" type="search" autocomplete="off"><button class="kb" id="bType" aria-label="Type">⌨️</button></div>
  <div id="sres"></div>
</header>
<main id="grid"></main>
<nav class="bar">
  <button class="bb" id="bOver"><span>📊</span><i id="lOver"></i></button>
  <button class="bb" id="bHist"><span>🕘</span><i id="lHist"></i></button>
  <button class="mic" id="bMic" aria-label="Mic">🎤</button>
  <button class="bb" id="bRep"><span>📋</span><i id="lRep"></i></button>
  <button class="bb" id="bSet"><span>⚙️</span><i id="lSet"></i></button>
</nav>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>
<div id="print"></div>

function locKey(l){const m=String(l).match(/\d+/g);return m?m.map(Number).join('.'):norm(l)}
function tokenize(text){
  const raw=translit(text).replace(/(\d)([a-z])/g,'$1 $2').replace(/([a-z])(\d)/g,'$1 $2').split(/[\s,.;:!?\-\/_»«„“”"]+/).filter(Boolean);

    if(/^\d+$/.test(n)){out.push({n,r:raw[i],num:+n});continue}
    const sc=n.match(SLCOMP);if(sc){const v=NUMW[sc[1]]+NUMW[sc[2]];out.push({n:String(v),r:String(v),num:v});continue}
    if(n in NUMW){let v=NUMW[n];const nx=raw[i+1]?norm(raw[i+1]):'';
      if(!(typeof LANG!=='undefined'&&LANG==='sl')&&v>=20&&v%10===0&&v<100&&nx in NUMW&&NUMW[nx]>0&&NUMW[nx]<10){v+=NUMW[nx];i++}

    if(n)out.push({n,r:raw[i]});

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function matchFirm(raw,known){
  const q=norm(raw);if(!q)return null;

  for(const k of known){const kn=norm(k);
    if(kn===q)return k;
    if(q.length>=3&&(kn.startsWith(q)||q.startsWith(kn))){const d=Math.abs(kn.length-q.length)*0.1;if(d<bd){bd=d;best=k}continue}
    const d=lev(q,kn);if(d<=Math.max(1,Math.floor(kn.length*0.25))&&d<bd){bd=d;best=k}}
  if(best)return best;

}

function tokEq(a,b){return a===b||(a.length>=5&&b.length>=5&&(a.slice(0,5)===b.slice(0,5)||lev(a,b)<=1))}
function parseLocAt(toks,locNames){
  const hasL=l=>/[a-zA-ZčćšžđČĆŠŽĐ]/.test(l);
  // posebne lokacije z imenom (Vani, Dule šotor…) – najdaljše ime najprej
  const special=locNames.filter(hasL).map(l=>({l,tk:tokenize(l).map(x=>x.n)})).sort((a,b)=>b.tk.length-a.tk.length);
  let s0=0;while(s0<toks.length&&toks[s0].num===undefined&&FILLER.has(toks[s0].n))s0++;
  for(const sp of special){if(sp.tk.length&&sp.tk.every((x,j)=>toks[s0+j]&&tokEq(toks[s0+j].n,x)))return{lok:sp.l,rest:toks.slice(s0+sp.tk.length)}}
  const lmap=new Map(locNames.filter(l=>!hasL(l)).map(l=>[locKey(l),l]));
  // zberi številke na začetku (lahko 0, do 6 delov); "070402"/"0501" razdeli po 2 cifri
  const el=[];let i=0;
  while(i<toks.length&&el.length<6){const tk=toks[i];
    if(tk.num!==undefined){
      if(/^\d{4}$|^\d{6}$/.test(tk.n)&&!lmap.has(String(tk.num))){for(let j=0;j<tk.n.length;j+=2)el.push({v:+tk.n.slice(j,j+2),i})}
      else el.push({v:tk.num,i});
      i++;continue}
    if(FILLER.has(tk.n)){i++;continue}
    break}
  // različice: kot izrečeno, in brez »nula« pred številko (»nula pet nula ena« = 5 1)
  const dep=el.filter((x,k)=>!(x.v===0&&el[k+1]&&el[k+1].v>0&&el[k+1].v<10&&el[k+1].i!==x.i));
  let lok=null,last=-1;
  for(let L=Math.min(3,el.length);L>=1&&!lok;L--)for(const V of [el,dep]){if(V.length<L)continue;
    const key=V.slice(0,L).map(x=>x.v).join('.');if(lmap.has(key)){lok=lmap.get(key);last=V[L-1].i;break}}
  if(!lok)return{err:'eLoc',arg:el.length?' ('+el.map(x=>pad(x.v)).join('-')+')':''};
  return{lok,rest:toks.slice(last+1)};
}
const MOVEW=new Set(['v','u','vu']);
function parseCommand(text,locNames,knownFirms,locData,noFirm){
  const toks=tokenize(text);
  const src=parseLocAt(toks,locNames);if(src.err)return src;
  // premik: »Zunaj Romunija 20 v Šotor kupci«
  for(let k=0;k<src.rest.length;k++){if(!MOVEW.has(src.rest[k].n))continue;
    const dst=parseLocAt(src.rest.slice(k+1),locNames);if(dst.err)continue;
    return finishMove(src.lok,dst.lok,[...src.rest.slice(0,k),...dst.rest],knownFirms,locData)}

}
function finishMove(lok,to,rest,knownFirms,locData){
  if(lok===to)return{err:'eSame'};
  let all=false;const nums=[],fw=[];
  for(const tk of rest){if(CLEARW.has(tk.n)){all=true;continue}if(tk.num!==undefined){if(tk.num>0)nums.push(tk.num);continue}if(FILLER.has(tk.n)||MINUSW.has(tk.n))continue;fw.push(tk.r)}
  const onLoc=(locData&&locData[lok])||[];
  let firma=fw.length?matchFirm(fw.join(' '),[...new Set([...onLoc.map(s=>s.firma),...knownFirms])]):null;
  let qty=nums.length&&!all?nums[nums.length-1]:null;
  if(!firma&&qty!==null){if(onLoc.length===1)firma=onLoc[0].firma;else return{err:'eMoveFirm',arg:lok}}
  return{move:true,lok,to,firma,qty};
}
function finishParse(lok,rest,knownFirms,locData,noFirm){
  let sign=1,clear=false;const nums=[],fw=[];
  for(const tk of rest){
    if(MINUSW.has(tk.n)){sign=-1;continue}
    if(CLEARW.has(tk.n)){clear=true;continue}
    if(tk.num!==undefined){nums.push(tk.num);continue}
    if(FILLER.has(tk.n))continue;
    fw.push(tk.r);
  }
  const onLoc=(locData&&locData[lok])||[];
  let firma=fw.length?matchFirm(fw.join(' '),[...new Set([...onLoc.map(s=>s.firma),...knownFirms])]):null;
  if(clear)return{lok,firma,clear:true};
  if(!firma&&sign<0&&onLoc.length===1)firma=onLoc[0].firma;
  if(!firma){if(noFirm===undefined)return{err:'eFirm',arg:lok,lok};firma=noFirm}
  const nz=nums.filter(n=>n>0);const qty=nz.length?nz[nz.length-1]:(nums.length?0:1);
  if(!qty)return{err:'eZero',lok};
  return{lok,firma,delta:sign*qty};
}
function addTo(st,firma,delta){
  const i=st.findIndex(s=>norm(s.firma)===norm(firma));
  if(i<0){if(delta>0)st.push({firma,palete:delta});return st}
  st[i].palete+=delta;if(st[i].palete<=0)st.splice(i,1);return st;
}

function noEdit(){if(canEdit())return false;toast(t('viewOnly'));return true}

/* ================= akcije ================= */
const locItems=name=>state.lok[idOf(name)]?.stavke||[];
const allLocData=()=>Object.fromEntries(allLocs().map(l=>[l,locItems(l)]));
const knownFirms=()=>{const s=new Set(state.post.firme);Object.values(state.lok).forEach(v=>(v.stavke||[]).forEach(x=>s.add(x.firma)));return[...s]};
const sumOf=st=>st.reduce((a,s)=>a+s.palete,0);
async function run(p){try{await p;return true}catch(e){toast(t('error')+(e.message||e));return false}}
async function applyDelta(lok,firma,delta){
  const ok=await run(store.changeLoc(idOf(lok),st=>addTo(st,firma,delta),[{kad:Date.now(),ko:me,lok,firma,delta}]));
  if(ok&&delta>0&&!state.post.firme.some(f=>norm(f)===norm(firma))){const p=clone(state.post);p.firme.push(firma);p.firme.sort((a,b)=>a.localeCompare(b));run(store.savePost(p))}
  if(ok)flash(lok);return ok;
}
async function clearLoc(lok,firma){
  const st=locItems(lok).filter(s=>!firma||norm(s.firma)===norm(firma));
  if(!st.length){toast(t('noThat',lok));return false}
  const logs=st.map(s=>({kad:Date.now(),ko:me,lok,firma:s.firma,delta:-s.palete,opis:'x'}));
  const ok=await run(store.changeLoc(idOf(lok),cur=>firma?cur.filter(s=>norm(s.firma)!==norm(firma)):[],logs));
  if(ok)flash(lok);return ok;
}
function planMove(p){
  const st=locItems(p.lok);if(!st.length)return{err:t('mvEmpty',p.lok)};
  let items;
  if(!p.firma)items=st.map(s=>({firma:s.firma,n:s.palete}));
  else{const s=st.find(x=>norm(x.firma)===norm(p.firma));if(!s)return{err:t('mvNone',p.lok,p.firma)};
    const n=p.qty===null?s.palete:Math.min(p.qty,s.palete);items=[{firma:s.firma,n,capped:p.qty!==null&&p.qty>s.palete,avail:s.palete}]}
  return{items};
}
async function applyMove(from,to,items){
  const kad=Date.now();
  const ok=await run(store.changeTwo(idOf(from),st=>{items.forEach(x=>addTo(st,x.firma,-x.n));return st},idOf(to),st=>{items.forEach(x=>addTo(st,x.firma,x.n));return st},
    items.map(x=>({kad,ko:me,lok:from,do:to,firma:x.firma,delta:x.n}))));
  if(ok){flash(to);toast(t('mvDone',from,to))}return ok;
}
function flash(lok){setTimeout(()=>{const e=document.querySelector('[data-lok="'+CSS.escape(lok)+'"]');if(e){e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');e.scrollIntoView({block:'nearest',behavior:'smooth'})}},150)}

function applyLang(){

}
function applyRole(){const v=!canEdit();$('#bMic').style.visibility=v?'hidden':'';$('#bType').style.display=v?'none':''}
function render(){
  const q=norm($('#search').value);
  let full=0,tot=0;const groups=[];let cur=null;
  for(const l of allLocs()){const g=isSp(l)?'*':String(l).includes('-')?String(l).split('-')[0]:'';if(!cur||cur.g!==g){cur={g,items:[]};groups.push(cur)}cur.items.push(l)}
  $('#grid').innerHTML=groups.map(G=>(G.g==='*'?'<div class="gh">'+t('spec')+'</div>':G.g?'<div class="gh">'+t('rack')+' '+esc(G.g)+'</div>':'')+'<div class="grp">'+G.items.map(l=>{
    const st=locItems(l),sum=sumOf(st),cap=capOf(l);if(st.length){full++;tot+=sum}
    const hit=q&&(st.some(s=>norm(s.firma).includes(q))||norm(l).includes(q));
    const cls='tile'+(isSp(l)?' sp':'')+(st.length?' full':'')+(cap&&sum>cap?' over':'')+(q?(hit?' hit':' dim'):'');
    const lines=st.slice(0,3).map(s=>'<div class="f">'+esc(s.firma)+' <b>'+s.palete+'</b></div>').join('')+(st.length>3?'<div class="f mut">+'+(st.length-3)+'</div>':'');
    return '<button class="'+cls+'" data-lok="'+esc(l)+'"><div class="n">'+esc(l)+(cap?'<small>'+sum+'/'+cap+'</small>':(sum?'<small>'+sum+'</small>':''))+'</div>'+lines+'</button>';
  }).join('')+'</div>').join('');
  $('#sum').textContent=t('sum',full,allLocs().length-full,tot)+(store.mode==='local'?t('localOnly'):'');
  $('#meName').textContent=me||'—';
  renderSearch(q);
  if(sheetState.type==='loc')renderLocBody();
  if(sheetState.type==='hist')renderHist();
  if(sheetState.type==='over')renderOver();
}
$('#grid').addEventListener('click',e=>{const x=e.target.closest('.tile');if(x)openLoc(x.dataset.lok)});
$('#search').addEventListener('input',render);
function renderSearch(q){
  const el=$('#sres');if(!q){el.innerHTML='';return}
  const byF={},locHit=[];
  for(const l of allLocs()){if(norm(l).includes(q))locHit.push(l);for(const x of locItems(l))if(norm(x.firma).includes(q))(byF[x.firma]=byF[x.firma]||[]).push([l,x.palete])}
  let html=Object.entries(byF).slice(0,8).map(([f,a])=>'<div class="sr"><span class="tt">'+esc(f)+'</span> · '+pal(a.reduce((s,x)=>s+x[1],0))+'<br>'+a.map(([l,n])=>'<button class="lc" data-go="'+esc(l)+'">'+esc(l)+' <b>'+n+'</b></button>').join('')+'</div>').join('');
  if(locHit.length)html+='<div class="sr">'+locHit.slice(0,12).map(l=>'<button class="lc" data-go="'+esc(l)+'">'+esc(l)+' <b>'+sumOf(locItems(l))+'</b></button>').join('')+'</div>';
  el.innerHTML=html||'<div class="sr mut">'+t('noRes')+'</div>';
}

function openLoc(lok){
  if(!ready())return;const ed=canEdit();
  openSheet('<h2>'+t('loc')+' '+esc(lok)+'</h2><div id="locBody"></div>'+
   (ed?'<div class="add"><input class="in" id="aF" list="firmList" placeholder="'+t('firm')+'" autocomplete="off"><input class="in num" id="aN" type="number" inputmode="numeric" min="1" value="1"></div>'+

  renderLocBody();

function renderLocBody(){
  const lok=sheetState.lok,st=locItems(lok),info=state.lok[idOf(lok)],cap=capOf(lok);
  const b=$('#locBody');if(!b)return;
  const ed=canEdit();b.innerHTML=st.length?st.map((s,i)=>'<div class="row"><span class="nm">'+esc(s.firma)+'</span>'+(ed?'<button class="sq" data-i="'+i+'" data-d="-1">−</button>':'')+'<span class="cnt">'+s.palete+'</span>'+(ed?'<button class="sq" data-i="'+i+'" data-d="1">+</button><button class="sq" data-i="'+i+'" data-m="1">⇄</button><button class="sq" data-i="'+i+'" data-x="1">🗑</button>':'')+'</div>').join('')+
    '<div class="mut" style="margin-top:6px">'+t('total')+': '+pal(sumOf(st))+(cap?' '+t('of')+' '+cap:'')+(info?.ko?' · '+t('last')+': '+esc(info.ko)+', '+fdt(info.kad):'')+'</div>'
    :'<p class="mut">'+t('isEmpty')+'</p>';
  b.querySelectorAll('.sq').forEach(x=>x.onclick=()=>{const s=st[+x.dataset.i];if(!s)return;

function histLine(x){if(x.do)return '<div><span class="mut">'+fdt(x.kad)+'</span> · '+esc(x.ko||'?')+' · <b>'+esc(x.lok)+'</b> → <b>'+esc(x.do)+'</b> '+esc(x.firma)+' <span class="mv">⇄ '+x.delta+'</span></div>';return '<div><span class="mut">'+fdt(x.kad)+'</span> · '+esc(x.ko||'?')+' · <b>'+esc(x.lok)+'</b> '+esc(x.firma)+' <span class="'+(x.delta>0?'plus':'minus')+'">'+(x.delta>0?'+':'')+x.delta+'</span>'+(x.opis?' <span class="mut">('+t('emptied')+')</span>':'')+'</div>'}

function openOver(){if(!ready())return;openSheet('<h2>'+t('ovT')+'</h2><div id="ovBody"></div><button class="btn" id="xB">'+t('close')+'</button>','over');$('#xB').onclick=closeSheet;renderOver()}
function renderOver(){
  const el=$('#ovBody');if(!el)return;
  const L=allLocs(),byF={},free=[],fullL=[];let occ=0,tot=0;
  for(const l of L){const st=locItems(l),s=sumOf(st),cap=capOf(l);if(!st.length){free.push(l);continue}occ++;tot+=s;if(cap&&s>=cap)fullL.push(l+' ('+s+'/'+cap+')');
    st.forEach(x=>{byF[x.firma]=byF[x.firma]||{n:0,l:[]};byF[x.firma].n+=x.palete;byF[x.firma].l.push(l+' ('+x.palete+')')})}
  const fl=Object.entries(byF).sort((a,b)=>b[1].n-a[1].n);

   '<h3>'+t('ovFull')+'</h3><p class="mut">'+(fullL.map(esc).join(', ')||'—')+'</p>'+
   '<h3>'+t('ovFree')+' ('+free.length+')</h3><p class="mut">'+(free.map(esc).join(', ')||'—')+'</p>';

}

/* ================= glas ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function stopRec(){if(rec){try{rec.abort()}catch(e){}rec=null}}
function startVoice(){
  if(!ready()||noEdit())return;
  if(!SR){openType('',true);return}
  stopRec();
  openSheet('<div class="listen"><div class="pulse">🎤</div><div class="big" id="live">'+t('listen')+'</div><p class="mut">'+t('vEx')+'</p><button class="btn" id="stopB">'+t('cancel')+'</button></div>','listen');
  $('#stopB').onclick=closeSheet;
  let got=false;
  try{
    rec=new SR();rec.lang=LANG==='sl'?'sl-SI':'hr-HR';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=3;
    rec.onresult=e=>{let txt='';for(const r of e.results)txt+=r[0].transcript;const l=$('#live');if(l)l.textContent=txt;
      if(e.results[e.results.length-1].isFinal){got=true;const alts=[...e.results[0]].map(a=>a.transcript);stopRec();handleText(txt,alts)}};
    rec.onerror=e=>{stopRec();if(e.error==='not-allowed'||e.error==='service-not-allowed')openType('',true,t('micDenied'));else if(e.error!=='aborted')openType('',true,t('notHeard'))};
    rec.onend=()=>{if(!got&&sheetState.type==='listen'){rec=null;closeSheet();toast(t('nothing'))}};
    rec.start();
  }catch(e){openType('',true,t('noVoice'))}
}
function handleText(txt,alts){
  const ld=allLocData(),kf=knownFirms();
  let p=parseCommand(txt,allLocs(),kf,ld,t('noFirm'));
  if(p.err&&alts)for(const a of alts){const q=parseCommand(a,allLocs(),kf,ld,t('noFirm'));if(!q.err){p=q;txt=a;break}}
  if(p.err){openType(txt,false,t(p.err,p.arg));return}
  showConfirm(p,txt);
}
function showConfirm(p,heard){
  if(p.move)return showMoveConfirm(p,heard);
  const cur=locItems(p.lok);let after,what;
  if(p.clear){after=p.firma?cur.filter(s=>norm(s.firma)!==norm(p.firma)):[];what=p.firma?t('removeAll',esc(p.firma)):t('emptyAll')}
  else{after=addTo(clone(cur),p.firma,p.delta);what=esc(p.firma)+' <span class="'+(p.delta>0?'plus':'minus')+'">'+(p.delta>0?'+ ':'− ')+pal(p.delta)+'</span>'}
  const c=capOf(p.lok),n=sumOf(after);
  openSheet('<div class="mut">'+t('heard')+': »'+esc(heard)+'«</div><div class="card"><div class="mut">'+t('loc')+'</div><div class="big">'+esc(p.lok)+'</div><div style="font-size:19px">'+what+'</div>'+
    '<div class="mut" style="margin-top:8px">'+t('after')+': '+(after.length?after.map(s=>esc(s.firma)+' '+s.palete).join(', '):t('empty'))+'</div>'+(c&&n>c?'<div class="err">'+t('overCap',n,c)+'</div>':'')+'</div>'+
    '<button class="btn p" id="okB">'+t('confirm')+'</button><div class="btns"><button class="btn" id="againB">'+t('again')+'</button><button class="btn" id="editB">'+t('fix')+'</button></div><button class="btn" id="xB">'+t('cancel')+'</button>','confirm');
  $('#xB').onclick=closeSheet;
  $('#okB').onclick=async()=>{closeSheet();const ok=p.clear?await clearLoc(p.lok,p.firma):await applyDelta(p.lok,p.firma,p.delta);if(ok)toast(t('saved',p.lok))};
  $('#againB').onclick=startVoice;$('#editB').onclick=()=>openType(heard);
}
function showMoveConfirm(p,heard){
  const pl=planMove(p);if(pl.err){openType(heard,false,pl.err);return}
  const items=pl.items,aft=addAll(clone(locItems(p.to)),items),c=capOf(p.to),n=sumOf(aft);
  const bef=addAll(clone(locItems(p.lok)),items.map(x=>({...x,n:-x.n})));
  openSheet((heard?'<div class="mut">'+t('heard')+': »'+esc(heard)+'«</div>':'')+'<div class="card"><div class="mut">'+t('mvT')+'</div><div class="big">'+esc(p.lok)+' → '+esc(p.to)+'</div>'+
    items.map(x=>'<div style="font-size:19px">'+esc(x.firma)+' <span class="plus">'+pal(x.n)+'</span></div>'+(x.capped?'<div class="err">'+t('mvCap',x.avail)+'</div>':'')).join('')+
    '<div class="mut" style="margin-top:8px">'+esc(p.lok)+': '+(bef.length?bef.map(s=>esc(s.firma)+' '+s.palete).join(', '):t('empty'))+'<br>'+esc(p.to)+': '+aft.map(s=>esc(s.firma)+' '+s.palete).join(', ')+'</div>'+
    (c&&n>c?'<div class="err">'+t('overCap',n,c)+'</div>':'')+'</div>'+
    '<button class="btn p" id="okB">'+t('confirm')+'</button><div class="btns"><button class="btn" id="againB">'+t('again')+'</button><button class="btn" id="editB">'+t('fix')+'</button></div><button class="btn" id="xB">'+t('cancel')+'</button>','confirm');
  $('#xB').onclick=closeSheet;$('#okB').onclick=async()=>{closeSheet();await applyMove(p.lok,p.to,items)};
  $('#againB').onclick=startVoice;$('#editB').onclick=()=>openType(heard||(p.lok+' '+(p.firma||'')+' '+(p.qty||'')+' v '+p.to));
}
function addAll(st,items){items.forEach(x=>addTo(st,x.firma,x.n));return st}
function openMoveSheet(lok,firma,n){
  const opts=allLocs().filter(l=>l!==lok).map(l=>'<option>'+esc(l)+'</option>').join('');
  openSheet('<h2>'+t('mvT')+': '+esc(lok)+'</h2><div class="big" style="font-size:18px">'+esc(firma)+'</div><label>'+t('mvQty')+'</label><input class="in num" id="mQ" type="number" inputmode="numeric" min="1" max="'+n+'" value="'+n+'" style="width:100px"><label>'+t('mvTo')+'</label><select class="in" id="mTo">'+opts+'</select><button class="btn p" id="mGo">'+t('next')+'</button><button class="btn" id="mX">'+t('cancel')+'</button>','move');

function openType(text,focus,err){
  if(!ready()||noEdit())return;
  openSheet('<h2>'+t('typeT')+'</h2>'+(err?'<p class="err">'+esc(err)+'</p>':'')+
   '<input class="in" id="cmd" value="'+esc(text||'')+'" placeholder="05-01 Bosch 3" autocomplete="off" enterkeyhint="go">'+

/* ================= predaja ================= */
function buildReport(){
  const now=Date.now(),L=allLocs();
  const since=state.handover&&now-state.handover.kad<24*3600e3?state.handover.kad:now-12*3600e3;
  let txt=t('rTitle')+'\n'+fdt(now)+'\n'+t('rBy')+': '+(me||'?')+'\n\n';
  const empty=[],byF={};let tot=0;
  for(const l of L){const st=locItems(l);if(!st.length){empty.push(l);continue}
    const s=sumOf(st);tot+=s;st.forEach(x=>byF[x.firma]=(byF[x.firma]||0)+x.palete);
    txt+=l+': '+st.map(x=>x.firma+' '+x.palete).join(', ')+(st.length>1?' ('+t('rTot')+' '+s+')':'')+'\n'}
  txt+='\n'+t('rEmpty')+' ('+empty.length+'): '+(empty.join(', ')||t('rNone'))+'\n';
  txt+='\n'+t('rByF')+':\n'+Object.entries(byF).sort((a,b)=>a[0].localeCompare(b[0])).map(([f,n])=>f+': '+n).join('\n')+'\n'+t('rAll')+': '+pal(tot)+'\n';
  const ch=state.hist.filter(x=>x.kad>=since).reverse();
  txt+='\n'+t('rCh')+' '+fdt(since)+' ('+ch.length+'):\n'+(ch.map(x=>ft(x.kad)+' '+x.ko+' – '+(x.do?x.lok+' → '+x.do+' '+x.firma+' '+x.delta:x.lok+' '+x.firma+' '+(x.delta>0?'+':'')+x.delta+(x.opis?' ('+t('emptied')+')':''))).join('\n')||t('rNone'))+'\n';
  return{txt,byF,tot,ch,since,now};
}
function openReport(){
  if(!ready())return;
  const r=buildReport();
  openSheet('<h2>'+t('repT')+'</h2><p class="mut">'+(state.handover?t('lastHand',fdt(state.handover.kad),esc(state.handover.ko)):t('noHand'))+'</p><pre class="rep">'+esc(r.txt)+'</pre>'+
   (navigator.share?'<button class="btn p" id="shB">'+t('send')+'</button>':'')+
   '<div class="btns"><button class="btn" id="cpB">'+t('copy')+'</button><button class="btn" id="pdB">📄 PDF</button></div><button class="btn" id="xB">'+t('close')+'</button>','rep');
  $('#xB').onclick=closeSheet;
  const mark=()=>{if(canEdit())run(store.setHandover({kad:Date.now(),ko:me}))};
  if(navigator.share)$('#shB').onclick=async()=>{try{await navigator.share({title:t('rTitle')+' '+fdt(r.now),text:r.txt});mark()}catch(e){}};
  $('#cpB').onclick=async()=>{try{await navigator.clipboard.writeText(r.txt);toast(t('copied'));mark()}catch(e){toast(t('noCopy'))}};
  $('#pdB').onclick=()=>{printReport(r);mark()};
}
function printReport(r){
  const rows=allLocs().map(l=>{const st=locItems(l);return '<tr><td><b>'+esc(l)+'</b></td><td>'+(st.map(x=>esc(x.firma)+' – '+x.palete).join('<br>')||'<i>'+t('empty')+'</i>')+'</td><td>'+(sumOf(st)||'')+'</td></tr>'}).join('');
  $('#print').innerHTML='<h2>'+t('rTitle')+' – '+fdt(r.now)+'</h2><p>'+t('rBy')+': '+esc(me)+' · '+t('rAll')+': '+pal(r.tot)+'</p><table><tr><th>'+t('loc')+'</th><th>'+t('firm')+'</th><th>Σ</th></tr>'+rows+'</table>'+
    '<h3>'+t('rByF')+'</h3><p>'+Object.entries(r.byF).map(([f,n])=>esc(f)+': '+n).join(' · ')+'</p><h3>'+t('rCh')+' '+fdt(r.since)+'</h3><p>'+(r.ch.map(x=>ft(x.kad)+' '+esc(x.ko)+' – '+(x.do?esc(x.lok)+' → '+esc(x.do)+' '+esc(x.firma)+' '+x.delta:esc(x.lok)+' '+esc(x.firma)+' '+(x.delta>0?'+':'')+x.delta)).join('<br>')||t('rNone'))+'</p>';
  setTimeout(()=>window.print(),100);
}

/* ================= profil (lokalni način) ================= */
function langBar(){if(!MULTI_LANG)return '';return '<div class="lang"><button data-l="sl" class="'+(LANG==='sl'?'on':'')+'">Slovenščina</button><button data-l="bs" class="'+(LANG==='bs'?'on':'')+'">Bosanski</button></div>'}
function wireLang(again){$('#sheet').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;LS.set('lk_lang',LANG);applyLang();render();again()})}
function pickProfile(){
  if(store.mode==='cloud'){openSettings();return}
  openSheet(langBar()+'<h2>'+t('who')+'</h2><p class="mut">'+t('whoHelp')+'</p>'+state.post.radnici.map((r,i)=>'<button class="btn" data-i="'+i+'">'+esc(r)+'</button>').join('')+
   (me?'<button class="btn" id="xB">'+t('close')+'</button>':'<p class="mut">'+t('namesIn')+'</p><button class="btn" id="sB">⚙️ '+t('set')+'</button>'),'profile',{locked:!me});
  wireLang(pickProfile);
  if($('#xB'))$('#xB').onclick=closeSheet;
  if($('#sB'))$('#sB').onclick=()=>openSettings();
  $('#sheet').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{me=state.post.radnici[+b.dataset.i];LS.set('lk_me',me);LS.set('lk_meIdx',+b.dataset.i);closeSheet(true);render()});
}

/* ================= prijava (oblak) ================= */
function authErr(e){const c=(e&&e.code)||'';return c.includes('invalid-credential')||c.includes('invalid-login')||c.includes('wrong-password')||c.includes('user-not-found')?t('eCred'):c.includes('email-already')?t('eInUse'):c.includes('weak-password')?t('eWeak'):c.includes('invalid-email')?t('eMail'):c.includes('too-many')?t('eMany'):c.includes('network')?t('eNet'):(e.message||String(e))}
function showLogin(msg){
  openSheet(langBar()+'<h2>📦 '+t('loginT')+'</h2>'+(msg?'<p class="err">'+esc(msg)+'</p>':'')+
   '<input class="in" id="lE" type="email" autocomplete="username" placeholder="'+t('email')+'" value="'+esc(LS.get('lk_lastmail','')||'')+'"><input class="in" id="lP" type="password" autocomplete="current-password" placeholder="'+t('pass')+'" style="margin-top:8px">'+
   '<button class="btn p" id="lIn">'+t('login')+'</button><div class="btns"><button class="btn" id="lReg">'+t('register')+'</button><button class="btn" id="lFor">'+t('forgot')+'</button></div>','login',{locked:true,solid:true});
  wireLang(()=>showLogin(msg));
  const em=()=>$('#lE').value.trim(),pw=()=>$('#lP').value;
  $('#lIn').onclick=async()=>{LS.set('lk_lastmail',em());try{await firebase.auth().signInWithEmailAndPassword(em(),pw())}catch(e){showLogin(authErr(e))}};
  $('#lReg').onclick=async()=>{LS.set('lk_lastmail',em());try{const c=await firebase.auth().createUserWithEmailAndPassword(em(),pw());await c.user.sendEmailVerification();showVerify(c.user)}catch(e){showLogin(authErr(e))}};
  $('#lFor').onclick=async()=>{if(!em()){toast(t('eMail'));return}try{await firebase.auth().sendPasswordResetEmail(em());toast(t('resetSent'))}catch(e){showLogin(authErr(e))}};
}
function showVerify(u,msg){
  openSheet('<h2>✉️ '+t('verifyT')+'</h2><p>'+t('verifyTxt',esc(u.email))+'</p>'+(msg?'<p class="err">'+esc(msg)+'</p>':'')+
   '<button class="btn p" id="vOk">'+t('verified')+'</button><div class="btns"><button class="btn" id="vRe">'+t('resend')+'</button><button class="btn d" id="vOut">'+t('logout')+'</button></div>','verify',{locked:true,solid:true});
  $('#vOk').onclick=async()=>{const cu=firebase.auth().currentUser;if(!cu)return;await cu.reload();if(firebase.auth().currentUser.emailVerified){await firebase.auth().currentUser.getIdToken(true);afterLogin(firebase.auth().currentUser)}else showVerify(cu,t('notYet'))};
  $('#vRe').onclick=async()=>{try{await firebase.auth().currentUser.sendEmailVerification();toast(t('sentAgain'))}catch(e){toast(authErr(e))}};
  $('#vOut').onclick=()=>firebase.auth().signOut();
}
function showNoAccess(){
  openSheet('<h2>🔒</h2><p>'+t('noAccess')+'</p><div class="card big" style="font-size:18px;overflow-wrap:anywhere">'+esc(myEmail)+'</div><button class="btn p" id="nRe">'+t('retry')+'</button><button class="btn d" id="nOut">'+t('logout')+'</button>','noacc',{locked:true,solid:true});
  $('#nRe').onclick=()=>afterLogin(firebase.auth().currentUser);$('#nOut').onclick=()=>firebase.auth().signOut();
}
function showCreate(){
  openSheet('<h2>'+t('createT')+'</h2><p>'+t('createTxt')+'</p><input class="in" id="cN" placeholder="'+t('yourName')+'"><button class="btn p" id="cB">'+t('create')+'</button><button class="btn d" id="cOut">'+t('logout')+'</button>','create',{locked:true,solid:true});
  $('#cOut').onclick=()=>firebase.auth().signOut();
  $('#cB').onclick=async()=>{const ime=$('#cN').value.trim();if(!ime){$('#cN').focus();return}
    try{const local=LS.get('lk_data',null);
      await FireStore.root.set({vlasnik:myEmail,post:{...clone(DEFAULT_POST),...((local&&local.post)||{})},handover:null,napravljeno:Date.now()});
      await FireStore.setMember(myEmail,ime,'radnik');
      if(local&&local.lok&&Object.keys(local.lok).length){const b=FireStore.db.batch();Object.entries(local.lok).forEach(([id,v])=>b.set(FireStore.root.collection('lokacije').doc(id),v));await b.commit()}
      afterLogin(firebase.auth().currentUser)}catch(e){toast(t('error')+e.message)}};
}
async function afterLogin(u){
  if(!u)return;
  myEmail=u.email.toLowerCase();
  try{
    const snap=await FireStore.root.get({source:'server'});
    if(!snap.exists){showCreate();return}
    state.vlasnik=snap.data().vlasnik;
    const m=await FireStore.root.collection('clani').doc(myEmail).get();
    if(!m.exists&&state.vlasnik!==myEmail){showNoAccess();return}
    me=m.exists&&m.data().ime?m.data().ime:myEmail.split('@')[0];myRole=state.vlasnik===myEmail?'radnik':((m.exists&&m.data().uloga)||'radnik');applyRole();
    store=FireStore;setSync('on');FireStore.start(render);closeSheet(true);render();
  }catch(e){
    if(String(e.code||e.message).includes('permission'))showNoAccess();
    else{setSync('err',e.message);toast(t('notConn')+e.message);showNoAccess()}
  }
}

/* ================= nastavitve ================= */
function openSettings(){
  const p=state.post,cfg=getCfg(),own=isOwner(),cloud=store.mode==='cloud';
  const st={on:t('stOn'),off:t('stOff'),err:t('stErr')+(syncState.msg||''),wait:t('stWait')}[syncState.s];
  let h=langBar()+'<h2>'+t('set')+'</h2>';
  if(cloud)h+='<p><b>'+esc(me)+'</b><br><span class="mut">'+esc(myEmail)+(own?' · '+t('owner'):'')+'</span></p>';
  if(own){
    if(!cloud)h+='<label>'+t('workers')+'</label><textarea class="in" id="sR">'+esc(p.radnici.join('\n'))+'</textarea>';
    h+='<label>'+t('quick')+'</label><div class="add" style="margin-top:0"><span class="mut">'+t('from')+'</span><input class="in num" id="gOd" type="number" inputmode="numeric" value="21"><span class="mut">'+t('to')+'</span><input class="in num" id="gDo" type="number" inputmode="numeric" value="21"></div>'+
     '<div class="add"><span class="mut">'+t('hFrom')+'</span><input class="in num" id="gVo" type="number" inputmode="numeric" value="1"><span class="mut">'+t('to')+'</span><input class="in num" id="gVd" type="number" inputmode="numeric" value="5"></div>'+
     '<div class="add"><span class="mut">'+t('pozN')+'</span><input class="in num" id="gP" type="number" inputmode="numeric" value="0"></div><p class="mut">'+t('genH')+'</p><button class="btn" id="gBtn">'+t('makeList')+'</button>'+
     '<label>'+t('locs')+'</label><textarea class="in" id="sL">'+esc(p.lokacije.join(', '))+'</textarea><p class="mut">'+t('locsHelp')+'</p>'+
     '<label>'+t('specL')+'</label><textarea class="in" id="sP">'+esc((p.posebne||[]).join('\n'))+'</textarea><p class="mut">'+t('specH')+'</p>'+
     '<label>'+t('cap')+'</label><input class="in num" id="sCap" type="number" inputmode="numeric" value="'+(+p.kapacitet||0)+'" style="width:100px"><p class="mut">'+t('capHelp')+'</p>'+
     '<label>'+t('capsL')+'</label><textarea class="in" id="sCaps" placeholder="05 = 4">'+esc(Object.entries(p.kapacitete||{}).map(([k,v])=>k+' = '+v).join('\n'))+'</textarea><p class="mut">'+t('capsH')+'</p>'+
     '<label>'+t('firms')+'</label><textarea class="in" id="sF">'+esc(p.firme.join('\n'))+'</textarea><p class="mut">'+t('firmsHelp')+'</p>'+
     '<button class="btn p" id="sSave">'+t('save')+'</button>';
  }else h+='<p class="mut">'+t('onlyOwner')+(cloud&&myRole!=='radnik'?'<br>'+t('viewOnly'):'')+'</p>';
  if(!cloud&&me)h+='<button class="btn" id="sMe">'+t('changeMe',esc(me))+'</button>';
  const roleSel=(id,v)=>'<select class="in" '+id+' style="margin-top:6px"><option value="radnik"'+(v!=='pregled'?' selected':'')+'>'+t('roleW')+'</option><option value="pregled"'+(v==='pregled'?' selected':'')+'>'+t('roleV')+'</option></select>';
  if(cloud&&own){
    h+='<h3>'+t('members')+'</h3>'+state.clani.map(c=>'<div class="row" style="flex-wrap:wrap"><span class="nm"><input class="in" data-rn="'+esc(c.email)+'" value="'+esc(c.ime||'')+'" style="padding:8px"><div class="mut">'+esc(c.email)+(c.email===state.vlasnik?' · '+t('owner'):'')+'</div>'+(c.email!==state.vlasnik?roleSel('data-role="'+esc(c.email)+'"',c.uloga):'')+'</span>'+(c.email!==state.vlasnik?'<button class="sq" data-del="'+esc(c.email)+'">🗑</button>':'')+'</div>').join('');
    h+='<label>'+t('addMember')+'</label><input class="in" id="mE" type="email" placeholder="'+t('mEmail')+'"><input class="in" id="mN" placeholder="'+t('mName')+'" style="margin-top:8px">'+roleSel('id="mR"','radnik')+'<button class="btn" id="mAdd">+ '+t('addMember')+'</button>';
  }
  h+='<h3>'+t('share')+'</h3><p>'+st+'</p>';
  if(cfg)h+=(cloud&&own?'<button class="btn p" id="sInv">'+t('invite')+'</button>':'')+(cloud?'<button class="btn" id="sOut">'+t('logout')+'</button>':'')+(BUILTIN_CFG?'':'<button class="btn d" id="sDis">'+t('disc')+'</button>');
  else h+='<p class="mut">'+t('cfgHelp')+'</p><textarea class="in" id="sC" placeholder="'+t('cfgPh')+'"></textarea><input class="in" id="sK" style="margin-top:8px" placeholder="'+t('kodPh')+'" autocomplete="off"><button class="btn p" id="sCon">'+t('connect')+'</button>';
  h+='<button class="btn" id="xB">'+t('close')+'</button>';
  openSheet(h,'set');
  wireLang(()=>openSettings());
  $('#xB').onclick=()=>{closeSheet();if(!me&&!cloud)pickProfile()};
  if($('#sMe'))$('#sMe').onclick=pickProfile;
  if(own){
    $('#gBtn').onclick=()=>{const a=+$('#gOd').value,b=+$('#gDo').value,vo=+$('#gVo').value,vd=+$('#gVd').value,pz=+$('#gP').value||0;if(!(a>=0&&b>=a&&b-a<100&&vo>=0&&vd>=vo&&vd-vo<20&&pz>=0&&pz<=30)){toast(t('checkNums'));return}
      const cur=$('#sL').value.split(/[,\n;]/).map(s=>s.trim()).filter(Boolean);$('#sL').value=sortLocs([...new Set([...cur,...makeLocs(a,b,vd-vo+1,vo,pz)])]).join(', ');toast(t('listMade'))};
    $('#sSave').onclick=async()=>{
      const np=clone(p);if($('#sR'))np.radnici=$('#sR').value.split('\n').map(s=>s.trim()).filter(Boolean);
      np.lokacije=[...new Set($('#sL').value.split(/[,\n;]/).map(s=>s.trim()).filter(Boolean))].slice(0,300);
      np.kapacitet=Math.max(0,parseInt($('#sCap').value)||0);
      np.kapacitete={};$('#sCaps').value.split('\n').forEach(line=>{const m=line.trim().match(/^(.+?)\s*[=:]\s*(\d+)$/);if(m)np.kapacitete[m[1].trim()]=+m[2]});
      np.posebne=[...new Set($('#sP').value.split('\n').map(s=>s.trim()).filter(Boolean))].filter(x=>!np.lokacije.includes(x)).slice(0,50);
      np.firme=[...new Set($('#sF').value.split('\n').map(s=>s.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
      if(!np.radnici.length||!np.lokacije.length){toast(t('needOne'));return}
      const go=async()=>{if(await run(store.savePost(np))){toast('✓');closeSheet(true);if(!me&&!cloud)pickProfile()}else openSettings()};
      const lost=[...(p.posebne||[]),...p.lokacije].filter(l=>!np.lokacije.includes(l)&&!np.posebne.includes(l)&&locItems(l).length);if(lost.length){ask(t('lostQ',lost.join(', ')),go,()=>openSettings());return}
      go()};
  }
  $('#sheet').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>ask(t('removeQ',b.dataset.del),()=>run(FireStore.delMember(b.dataset.del)).then(()=>setTimeout(()=>openSettings(),300)),()=>openSettings()));
  if($('#mAdd'))$('#mAdd').onclick=async()=>{const e=$('#mE').value.trim().toLowerCase(),n=$('#mN').value.trim();if(!/^\S+@\S+\.\S+$/.test(e)||!n){toast(t('eMail'));return}if(await run(FireStore.setMember(e,n,$('#mR').value)))setTimeout(()=>openSettings(),300)};
  $('#sheet').querySelectorAll('[data-rn]').forEach(s=>s.onchange=()=>{const c=state.clani.find(x=>x.email===s.dataset.rn);const v=s.value.trim();if(c&&v)run(FireStore.setMember(c.email,v,c.uloga)).then(()=>{if(c.email===myEmail)me=v;toast('✓');render()})});
  $('#sheet').querySelectorAll('[data-role]').forEach(s=>s.onchange=()=>{const c=state.clani.find(x=>x.email===s.dataset.role);if(c)run(FireStore.setMember(c.email,c.ime,s.value)).then(()=>toast('✓'))});
  if($('#sInv'))$('#sInv').onclick=async()=>{const link=location.href.split('#')[0];
    try{if(navigator.share)await navigator.share({text:t('inviteTxt')+'\n'+link});else{await navigator.clipboard.writeText(link);toast(t('linkCopied'))}}catch(e){}};
  if($('#sOut'))$('#sOut').onclick=()=>{closeSheet(true);firebase.auth().signOut()};
  if($('#sDis'))$('#sDis').onclick=()=>ask(t('discQ'),async()=>{try{if(window.firebase)await firebase.auth().signOut()}catch(e){}LS.del('lk_cfg');location.reload()},()=>openSettings());
  if($('#sCon'))$('#sCon').onclick=()=>{
    const raw=$('#sC').value,kod=$('#sK').value.trim().toLowerCase().replace(/[^\w-]/g,'');const fb={};
    raw.replace(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g,(_,k,v)=>{fb[k]=v});
    if(!fb.apiKey||!fb.projectId){toast(t('noCfg'));return}
    if(kod.length<4){toast(t('shortKod'));return}
    LS.set('lk_cfg',{firebase:fb,kod});location.reload()};
}

/* ================= zagon ================= */
$('#bMic').onclick=startVoice;$('#bType').onclick=()=>openType('',true);$('#bHist').onclick=openHist;$('#bRep').onclick=openReport;$('#bSet').onclick=()=>openSettings();$('#bOver').onclick=openOver;
$('#meChip').onclick=()=>store.mode==='cloud'?openSettings():pickProfile();
(async function boot(){
  applyLang();
  {const im=new Image();im.onload=()=>{$('#logoBox').innerHTML='<img src="logo.png" alt="">'};im.src='logo.png'}
  const m=location.hash.match(/cfg=([^&]+)/);
  if(m){try{LS.set('lk_cfg',JSON.parse(decodeURIComponent(escape(atob(m[1])))))}catch(e){}history.replaceState(null,'',location.pathname+location.search)}
  const cfg=getCfg();
  if(!cfg){setSync('off');LocalStore.init(render);if(!me)pickProfile();return}
  me=null;setSync('wait');render();
  try{await FireStore.load(cfg)}catch(e){setSync('err',e.message);LocalStore.init(render);me=LS.get('lk_me',null);toast(t('notConn')+e.message);if(!me)pickProfile();return}
  firebase.auth().onAuthStateChanged(u=>{
    if(!u){FireStore.stop();myEmail=null;me=null;myRole='radnik';store=LocalStore;state.lok={};state.hist=[];state.clani=[];render();showLogin();return}
    if(!u.emailVerified){showVerify(u);return}
    afterLogin(u);
  });
})();
</script>

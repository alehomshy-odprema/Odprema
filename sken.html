<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1320">
<title>SSCC preizkus</title>
<style>
:root{--gold:#d4af37;--bg:#0d1320;--card:#151d2c;--sheet:#1d2940;--ink:#e6edf7;--mut:#8b9ab1;--line:#253147;--acc:#3b8cff;--blue:#6fb3ff;--green:#3ddc97;--red:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
header{padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px;color:var(--blue)}
.mut{color:var(--mut);font-size:13px}
main{padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.seg{display:flex;gap:6px;margin:10px 0}.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;font-size:14px}.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;margin-top:10px;text-align:center}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-size:18px}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
#cam{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column}
#cam[hidden]{display:none}
#vbox{position:relative;flex:1;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:5%;right:5%;top:32%;height:36%;border:3px solid var(--gold);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.3);pointer-events:none}
.frame.hit{border-color:var(--green)}
#camTop{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{background:rgba(0,0,0,.65);border:0;border-radius:20px;padding:8px 12px;font-size:14px;color:#fff}
#diag{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.6);border-radius:10px;padding:6px 10px;font:12px ui-monospace,Menlo,monospace;color:#cfe}
#zoomRow{position:absolute;left:10px;right:10px;bottom:60px;display:flex;align-items:center;gap:8px;color:#fff;font-size:13px}#zoomRow input{flex:1}
#camBar{background:var(--sheet);border-top:3px solid var(--gold);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
#camMsg{min-height:40px;font-size:15px}
#camMsg b{color:var(--green);font-size:18px;letter-spacing:.5px}
.card{background:var(--card);border:1.5px solid var(--gold);border-radius:14px;padding:12px;margin-top:10px}
.pal{border-bottom:1px solid var(--line);padding:8px 0}.pal:last-child{border-bottom:0}
.code{font-family:ui-monospace,Menlo,monospace;font-size:15px}
.ok{color:var(--green)}.bad{color:var(--red)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.stat{background:var(--card);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px;color:var(--blue)}
.err{color:var(--red);font-weight:600;margin-top:8px}
</style>
</head>
<body>
<header><h1>📷 SSCC preizkus</h1><div class="mut">Samo za preizkus branja etiket. Ne shranjuje ničesar v aplikacijo Odprema.</div></header>
<main>
  <div class="seg" id="mode">
    <button data-m="one" class="on">1 koda = 1 paleta</button>
    <button data-m="multi">Več kod na paleti</button>
  </div>
  <div class="mut" id="modeHelp"></div>
  <button class="btn p" id="start">📷 Začni skenirati</button>
  <label class="btn" for="file">🖼 Preberi s fotografije</label><input type="file" id="file" accept="image/*" capture="environment" hidden>
  <div id="loadErr" class="err"></div>
  <div class="stats"><div class="stat"><b id="sPal">0</b>palet</div><div class="stat"><b id="sCode">0</b>kod</div><div class="stat"><b id="sTime">–</b>povp. čas</div></div>
  <div class="card" id="list"><div class="mut">Še ni skeniranih palet.</div></div>
  <div class="btns"><button class="btn" id="copy">📋 Kopiraj seznam</button><button class="btn" id="clear">🗑 Počisti</button></div>
  <p class="mut" id="eng"></p>
</main>

<div id="cam" hidden>
  <div id="vbox"><video id="v" playsinline muted autoplay></video><div class="frame" id="frame"></div>
    <div id="camTop"><span class="pill" id="camCount">0 palet</span><button class="pill" id="swCam">🔄 Kamera</button><button class="pill" id="torch" hidden>🔦</button><button class="pill" id="snap">📸 Slikaj</button></div>
    <div id="zoomRow" hidden>🔍<input type="range" id="zoom"></div>
    <div id="diag"></div></div>
  <div id="camBar"><div id="camMsg">Kodo postavite vodoravno v okvir, 15–30 cm od telefona.</div>
    <div class="btns"><button class="btn" id="next" hidden>➡ Naslednja paleta</button><button class="btn p" id="done">✓ Končano</button></div></div>
</div>
<canvas id="cv" hidden></canvas>

<script>
/* Code 128 / GS1-128 bralnik – brez zunanjih knjižnic */
(function(g){
const P=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232"];
const PAT=P.map(s=>s.split('').map(Number));
const STOP=[2,3,3,1,1,1,2];
const EDGE=PAT.map(p=>[p[0]+p[1],p[1]+p[2],p[2]+p[3],p[3]+p[4]]);
function matchSym(r,o){ // r = dolžine 6 elementov od indeksa o
  let w=0;for(let i=0;i<6;i++)w+=r[o+i];const m=w/11;let best=-1,bd=1e9,second=1e9;
  const e=[(r[o]+r[o+1])/m,(r[o+1]+r[o+2])/m,(r[o+2]+r[o+3])/m,(r[o+3]+r[o+4])/m];
  for(let k=0;k<PAT.length;k++){const p=PAT[k],q=EDGE[k];let d1=0,d2=0;
    for(let i=0;i<6;i++){const x=r[o+i]/m-p[i];d1+=x*x}
    for(let i=0;i<4;i++){const x=e[i]-q[i];d2+=x*x}
    const d=Math.min(d1,d2*0.8);
    if(d<bd){second=bd;bd=d;best=k}else if(d<second)second=d}
  return bd<1.6&&bd<second*0.75?best:-1}
function isStop(r,o){if(o+7>r.length)return false;let w=0;for(let i=0;i<7;i++)w+=r[o+i];const m=w/13;let d=0;for(let i=0;i<7;i++){const x=r[o+i]/m-STOP[i];d+=x*x}return d<2.2}
function decodeRuns(r){ // r[0] je temna črta
  for(let s=0;s+6<r.length;s+=2){
    const st=matchSym(r,s);if(st<103||st>105)continue;
    if(s>0&&r[s-1]<(r[s]+r[s+1]+r[s+2]+r[s+3]+r[s+4]+r[s+5])/11*3)continue; // tiha cona
    const vals=[st];let o=s+6,ok=false;
    while(o+6<=r.length){if(isStop(r,o)){ok=true;break}const v=matchSym(r,o);if(v<0||v>=103)break;vals.push(v);o+=6}
    if(!ok||vals.length<3)continue;
    let sum=vals[0];for(let i=1;i<vals.length-1;i++)sum+=vals[i]*i;
    if(sum%103!==vals[vals.length-1])continue;
    return toText(vals.slice(0,-1))}
  return null}
function toText(v){let set=v[0]===103?'A':v[0]===104?'B':'C',out='';
  for(let i=1;i<v.length;i++){const c=v[i];
    if(c===102){out+=i===1?'':'\x1d';continue}
    if(set==='C'){if(c<100){out+=(c<10?'0':'')+c;continue}if(c===100){set='B';continue}if(c===101){set='A';continue}continue}
    if(c===99){set='C';continue}if(set==='B'&&c===100||set==='A'&&c===101)continue;
    if(c===98)continue;if(set==='A'&&c===100){set='B';continue}if(set==='B'&&c===101){set='A';continue}
    out+=set==='B'?String.fromCharCode(c+32):String.fromCharCode(c<64?c+32:c-64)}
  return out}
function rowRuns(gray,w,y,x0,x1,hgt){
  const n=x1-x0,row=new Float32Array(n);const ys=[y-1,y,y+1].filter(v=>v>=0&&v<hgt);
  for(let i=0;i<n;i++){let s=0;for(const yy of ys)s+=gray[yy*w+x0+i];row[i]=s/ys.length}
  let mn=255,mx=0;for(let i=0;i<n;i++){if(row[i]<mn)mn=row[i];if(row[i]>mx)mx=row[i]}if(mx-mn<35)return null;
  const win=Math.max(12,(n/14)|0),pre=new Float64Array(n+1);for(let i=0;i<n;i++)pre[i+1]=pre[i]+row[i];
  const sg=new Float32Array(n);for(let i=0;i<n;i++){const a=Math.max(0,i-win),b=Math.min(n,i+win);sg[i]=row[i]-((pre[b]-pre[a])/(b-a)*0.6+(mn+mx)/2*0.4)}
  const hy=(mx-mn)*0.04;const cr=[];let st=sg[0]<0?1:0;
  for(let i=0;i<n-1;i++){const a=sg[i],b=sg[i+1];
    if(st===0&&b<-hy&&a>=b){let j=i;while(j>0&&sg[j]<0)j--;const x=j+sg[j]/(sg[j]-sg[j+1]);cr.push([x,1]);st=1}
    else if(st===1&&b>hy&&a<=b){let j=i;while(j>0&&sg[j]>0)j--;const x=j+sg[j]/(sg[j]-sg[j+1]);cr.push([x,0]);st=0}}
  const i0=cr.findIndex(c=>c[1]===1);if(i0<0)return null;const runs=[];
  for(let i=i0;i<cr.length-1;i++)runs.push(Math.max(0.3,cr[i+1][0]-cr[i][0]));
  return {runs}}
function rowRunsInt(gray,w,y,x0,x1){
  const n=x1-x0,row=new Float32Array(n);for(let i=0;i<n;i++)row[i]=gray[y*w+x0+i];
  let mn=255,mx=0;for(let i=0;i<n;i++){if(row[i]<mn)mn=row[i];if(row[i]>mx)mx=row[i]}if(mx-mn<35)return null;
  const win=Math.max(16,(n/12)|0),pre=new Float64Array(n+1);for(let i=0;i<n;i++)pre[i+1]=pre[i]+row[i];
  const runs=[];let cur=-1,len=0;
  for(let i=0;i<n;i++){const a=Math.max(0,i-win),b=Math.min(n,i+win);const avg=(pre[b]-pre[a])/(b-a);
    const dark=row[i]<(avg+(mn+mx)/2)/2?1:0;if(dark===cur)len++;else{if(cur!==-1)runs.push([cur,len]);cur=dark;len=1}}
  runs.push([cur,len]);const i0=runs.findIndex(x=>x[0]===1);if(i0<0)return null;return{runs:runs.slice(i0).map(x=>x[1])}}
function scanGray(gray,w,h,opt){opt=opt||{};const rows=opt.rows||24,y0=opt.y0||0,y1=opt.y1||h,x0=opt.x0||0,x1=opt.x1||w;
  for(let k=0;k<rows;k++){const y=Math.min(y1-1,Math.round(y0+(y1-y0)*(k+0.5)/rows));
    for(const f of [rowRuns,rowRunsInt]){const rr=f(gray,w,y,x0,x1,h);if(!rr)continue;const r=rr.runs;
      let res=decodeRuns(r);
      if(!res){const rev=r.slice().reverse();res=decodeRuns(r.length%2===0?rev.slice(1):rev)}
      if(res)return res}}
  return null}
function toGray(ctx,w,h){const d=ctx.getImageData(0,0,w,h).data,g=new Uint8Array(w*h);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(d[j]*30+d[j+1]*59+d[j+2]*11)/100;return g}
g.C128={decodeRuns,scanGray,toGray,_P:P};
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let mode='one',pallets=[],cur=null,times=[],tStart=0,stream=null,running=false,lastCode='',lastAt=0,detector=null,cams=[],camIdx=-1;
const D={frames:0,own:0,nat:0,lastRaw:'',res:'',t0:0};
const HELP={one:'Kamera se po vsaki prebrani kodi sama zapre. Ena koda = ena paleta.',multi:'Kamera ostane odprta. Skenirajte vse kode na paleti, nato »Naslednja paleta«. Na koncu »Končano«.'};
$('#modeHelp').textContent=HELP.one;
$('#mode').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$('#mode').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('#modeHelp').textContent=HELP[mode]});

function gs1ok(d){let s=0;for(let i=0;i<17;i++)s+=(+d[i])*((i%2===0)?3:1);return (10-s%10)%10===+d[17]}
function extractSSCC(raw){
  const t=String(raw).replace(/^\]C1/,'').replace(/[()\s]/g,'');
  for(const p of t.split('\x1d')){const m=p.match(/^00(\d{18})$/)||p.match(/^00(\d{18})/);if(m&&gs1ok(m[1]))return{sscc:m[1],ok:true}}
  const d=t.replace(/\D/g,'');
  if(d.length===18)return{sscc:d,ok:gs1ok(d)};
  if(d.length===20&&d.startsWith('00'))return{sscc:d.slice(2),ok:gs1ok(d.slice(2))};
  const m=d.match(/00(\d{18})/);if(m)return{sscc:m[1],ok:gs1ok(m[1])};
  return null}

let ac=null;function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=ok?1600:400;o.connect(g);g.connect(ac.destination);g.gain.value=.15;o.start();o.stop(ac.currentTime+(ok?.12:.3))}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(ok?80:[60,60,60])}catch(e){}}

function render(){
  const codes=pallets.reduce((a,p)=>a+p.codes.length,0);
  $('#sPal').textContent=pallets.length;$('#sCode').textContent=codes;
  $('#sTime').textContent=times.length?(times.reduce((a,b)=>a+b,0)/times.length/1000).toFixed(1)+' s':'–';
  $('#list').innerHTML=pallets.length?pallets.slice().reverse().map((p,i)=>'<div class="pal"><div class="mut">Paleta '+(pallets.length-i)+' · '+p.time+'</div>'+p.codes.map(c=>'<div class="code">'+esc(c.sscc)+' <span class="'+(c.ok?'ok':'bad')+'">'+(c.ok?'✓':'✗ kontrolna številka')+'</span> <span class="mut">'+(c.ms/1000).toFixed(1)+' s · '+c.by+'</span></div>').join('')+'</div>').join(''):'<div class="mut">Še ni skeniranih palet.</div>';
  $('#camCount').textContent=pallets.length+' palet'+(cur&&mode==='multi'?' · '+cur.codes.length+' kod':'');
}
function diag(){const fps=D.t0?(D.frames/((Date.now()-D.t0)/1000)).toFixed(1):'0';$('#diag').textContent='slika '+D.res+' · '+fps+' sl/s · bralnik: lasten'+(detector?' + vgrajen':'')+'\nzadnje prebrano: '+(D.lastRaw||'—')}

function onCode(raw,by){
  D.lastRaw=String(raw).replace(/\x1d/g,'<GS>').slice(0,40)+' ('+by+')';
  const r=extractSSCC(raw);const now=Date.now();
  if(!r){if(now-lastAt>1500){$('#camMsg').innerHTML='Prebrano, a to ni SSCC: <span class="mut">'+esc(String(raw).slice(0,40))+'</span>';lastAt=now}return}
  if(r.sscc===lastCode&&now-lastAt<2500)return;
  lastCode=r.sscc;lastAt=now;
  const all=pallets.flatMap(p=>p.codes.map(c=>c.sscc)).concat(cur?cur.codes.map(c=>c.sscc):[]);
  if(all.includes(r.sscc)){beep(false);$('#camMsg').innerHTML='<span class="bad">Ta koda je že skenirana:</span> <span class="code">'+r.sscc+'</span>';return}
  const ms=Math.max(0,now-tStart);tStart=now;times.push(ms);beep(r.ok);
  $('#frame').classList.add('hit');setTimeout(()=>$('#frame').classList.remove('hit'),400);
  const d=new Date();const time=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const item={...r,ms,by};
  if(mode==='one'||!running){pallets.push({time,codes:[item]});render();if(running)stopCam();return}
  if(!cur)cur={time,codes:[]};cur.codes.push(item);
  $('#camMsg').innerHTML=(r.ok?'✓ ':'<span class="bad">✗ </span>')+'<b>'+r.sscc+'</b><div class="mut">Še koda na tej paleti, ali »Naslednja paleta«.</div>';render();
}
function nextPallet(){if(cur&&cur.codes.length){pallets.push(cur);cur=null;render();$('#camMsg').textContent='Naslednja paleta – kodo v okvir.';beep(true);tStart=Date.now()}}

/* --- branje slike: lasten bralnik + vgrajen (če obstaja) --- */
const cv=$('#cv'),cx=cv.getContext('2d',{willReadFrequently:true});
function scanCanvas(rows,full){
  const g=C128.toGray(cx,cv.width,cv.height);
  const r=C128.scanGray(g,cv.width,cv.height,{rows});if(r)return r;
  if(full){for(let k=0;k<4;k++){const y0=Math.round(cv.height*k/4),y1=Math.round(cv.height*(k+1)/4);const r2=C128.scanGray(g,cv.width,cv.height,{rows:Math.max(20,rows/4),y0,y1});if(r2)return r2}}
  return null}
function drawBand(src,sw,sh){ // srednji pas, kjer je okvir
  const x=sw*0.04,w=sw*0.92,y=sh*0.30,h=sh*0.40;const sc=Math.min(1,1600/w);
  cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);cx.drawImage(src,x,y,w,h,0,0,cv.width,cv.height)}
async function tick(){
  if(!running)return;const v=$('#v');
  if(v.videoWidth){D.res=v.videoWidth+'×'+v.videoHeight;D.frames++;
    drawBand(v,v.videoWidth,v.videoHeight);
    const r=scanCanvas(30,false);if(r){D.own++;onCode(r,'lasten')}
    else if(detector){try{const res=await detector.detect(cv);if(res&&res.length){D.nat++;onCode(res[0].rawValue,'vgrajen')}}catch(e){}}
    diag()}
  if(running)setTimeout(tick,60);
}
async function decodeImageSource(src,w,h){
  const sc=Math.min(1,2400/Math.max(w,h));cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);cx.drawImage(src,0,0,cv.width,cv.height);
  let r=scanCanvas(240,true);if(r)return[r,'lasten'];
  // obrnjena slika (koda navpično)
  const t=document.createElement('canvas');t.width=cv.height;t.height=cv.width;const tx=t.getContext('2d');tx.translate(t.width,0);tx.rotate(Math.PI/2);tx.drawImage(cv,0,0);
  cv.width=t.width;cv.height=t.height;cx.drawImage(t,0,0);r=scanCanvas(240,true);if(r)return[r,'lasten'];
  if(detector){try{const res=await detector.detect(src);if(res&&res.length)return[res[0].rawValue,'vgrajen']}catch(e){}}
  return[null]}
async function snap(){
  $('#camMsg').textContent='Slikam …';const tr=stream&&stream.getVideoTracks()[0];let res=[null];
  try{if(window.ImageCapture&&tr){const bmp=await createImageBitmap(await new ImageCapture(tr).takePhoto());res=await decodeImageSource(bmp,bmp.width,bmp.height)}}catch(e){}
  if(!res[0]){const v=$('#v');res=await decodeImageSource(v,v.videoWidth,v.videoHeight)}
  if(res[0])onCode(res[0],res[1]+', slika');else{beep(false);$('#camMsg').textContent='Na sliki ni prebrane kode. Poskusite bližje ali brez odseva.'}}

async function openStream(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const c=camIdx>=0&&cams[camIdx]?{deviceId:{exact:cams[camIdx].deviceId}}:{facingMode:{ideal:'environment'}};
  stream=await navigator.mediaDevices.getUserMedia({video:{...c,width:{ideal:1920},height:{ideal:1080}},audio:false});
  const v=$('#v');v.srcObject=stream;await v.play().catch(()=>{});
  const tr=stream.getVideoTracks()[0];let cap={};try{cap=tr.getCapabilities?tr.getCapabilities():{}}catch(e){}
  try{if(cap.focusMode&&cap.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
  $('#torch').hidden=!cap.torch;let on=false;$('#torch').onclick=()=>{on=!on;tr.applyConstraints({advanced:[{torch:on}]}).catch(()=>{})};
  if(cap.zoom){const z=$('#zoom');z.min=cap.zoom.min;z.max=Math.min(cap.zoom.max,8);z.step=cap.zoom.step||0.1;z.value=Math.min(Math.max(cap.zoom.min,1.5),z.max);tr.applyConstraints({advanced:[{zoom:+z.value}]}).catch(()=>{});z.oninput=()=>tr.applyConstraints({advanced:[{zoom:+z.value}]}).catch(()=>{});$('#zoomRow').hidden=false}else $('#zoomRow').hidden=true;
  const lb=tr.label||'';$('#swCam').textContent='🔄 '+(lb?lb.replace(/camera\s*/i,'').slice(0,18):'Kamera');
}
async function startCam(){
  $('#loadErr').textContent='';
  if(!detector&&'BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();const want=['code_128','itf','code_39','data_matrix','qr_code'].filter(x=>f.includes(x));if(want.length)detector=new BarcodeDetector({formats:want})}catch(e){}}
  try{await openStream()}catch(e){$('#loadErr').textContent=e.name==='NotAllowedError'?'Dostop do kamere ni dovoljen. Dovolite kamero v brskalniku in poskusite znova.':(e.message||String(e));return}
  try{cams=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput')}catch(e){cams=[]}
  $('#swCam').hidden=cams.length<2;
  $('#cam').hidden=false;$('#next').hidden=mode!=='multi';running=true;tStart=Date.now();lastCode='';cur=null;D.frames=0;D.own=0;D.nat=0;D.t0=Date.now();
  $('#eng').textContent='Bralnik: lasten'+(detector?' + vgrajen':'');
  $('#camMsg').textContent='Kodo postavite vodoravno v okvir, 15–30 cm od telefona.';render();tick();
}
function stopCam(){running=false;if(cur&&cur.codes.length){pallets.push(cur);cur=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#cam').hidden=true;render()}
$('#swCam').onclick=async()=>{if(cams.length<2)return;const curId=stream&&stream.getVideoTracks()[0].getSettings().deviceId;let i=cams.findIndex(c=>c.deviceId===curId);camIdx=(i+1)%cams.length;try{await openStream()}catch(e){$('#camMsg').textContent='Te kamere ni mogoče odpreti.'}};
$('#snap').onclick=snap;$('#start').onclick=startCam;$('#done').onclick=stopCam;$('#next').onclick=nextPallet;
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#loadErr').textContent='Berem …';
  try{const bmp=await createImageBitmap(f);tStart=Date.now();const res=await decodeImageSource(bmp,bmp.width,bmp.height);
    if(res[0]){$('#loadErr').textContent='';onCode(res[0],res[1]+', fotografija')}else $('#loadErr').textContent='Na fotografiji ni prebrane kode.'}catch(err){$('#loadErr').textContent=err.message}e.target.value=''};
$('#clear').onclick=()=>{pallets=[];times=[];render()};
$('#copy').onclick=async()=>{const txt=pallets.map((p,i)=>'Paleta '+(i+1)+' ('+p.time+'): '+p.codes.map(c=>c.sscc+(c.ok?'':' (napaka)')).join(', ')).join('\n')+'\nPovprečen čas: '+$('#sTime').textContent;
  try{await navigator.clipboard.writeText(txt);$('#copy').textContent='✓ Kopirano';setTimeout(()=>$('#copy').textContent='📋 Kopiraj seznam',1500)}catch(e){}};
render();
</script>

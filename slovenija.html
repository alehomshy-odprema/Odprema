<style>

.seg2{display:flex;gap:6px;margin-bottom:8px}.seg2 button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;font-size:14px;color:var(--mut)}.seg2 button.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.d.ld{border-left-color:var(--mut);opacity:.8}
.bdg{margin-top:7px;border-radius:9px;padding:7px 10px;font-weight:800;font-size:14px;text-align:center}
.bdg.ok{background:rgba(69,227,160,.16);color:var(--green);border:1px solid var(--green)}.bdg.ld{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.nak{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:12px;padding:10px 12px;margin-top:12px}
.nh{font-weight:800;font-size:16px;color:var(--orange);margin-bottom:4px}.nl{font-size:14px;color:var(--mut);padding:3px 0}.nl.ok{color:var(--green);font-weight:700}.nl span{font-size:12.5px}
.nw{font-size:13px;color:var(--orange);margin-top:6px}
.btn.nb{background:var(--orange);border-color:var(--orange);color:#111;font-weight:800}
.nlist{display:flex;flex-direction:column;gap:6px}.nck{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:0;color:var(--ink);font-weight:500}
.nck input{width:22px;height:22px;flex:none}.nck span{flex:1}.nck i{font-style:normal;color:var(--mut);font-size:13px;white-space:nowrap}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:14px;color:var(--mut)}.seg2.sm{margin:0;width:120px}.seg2.sm button{padding:6px}
.wt{border:1px solid var(--line)!important;border-radius:14px;padding:4px 9px;font-size:13px;color:var(--mut)!important;background:var(--bg)!important;margin-right:4px}.wt.on{border-color:var(--orange)!important;color:var(--orange)!important;font-weight:700}
.chk2{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:500}.chk2 input{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a3a57;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;max-width:90vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}

.gate a{color:var(--blue)}
.ver{text-align:center;font-size:12px;color:var(--mut);margin-top:18px}
.pend{font-size:12px;color:var(--orange);text-align:center;margin-top:4px}
</style>

<body>
<header>

  <input class="reg" id="reg" placeholder="Regija za ta dan (neobvezno), npr. Štajerska" autocomplete="off">
</header>
<main id="main"><div class="empty">Nalagam …</div></main>
<nav>
  <button id="nDay"><span>📦</span>Danes</button>

<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>

<script>
const VER='5',VER_DATE='07.11.2026';
const CFG={apiKey:"AIzaSyC2dBxlVzWbvWPPT55g7cXy6C2kCtoWH6Q",authDomain:"odprema-lokacije.firebaseapp.com",projectId:"odprema-lokacije",storageBucket:"odprema-lokacije.firebasestorage.app",messagingSenderId:"152804096191",appId:"1:152804096191:web:274b7867ed99e67e0fae0a"};
const KOD="odprema-7k2x";
const FB='https://www.gstatic.com/firebasejs/10.12.2/';
const STEPS=[['p','Pripr.'],['s','SSCC'],['t','Teht.'],['v','Povito']];
const ROK_H=9;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dmy=d=>pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const DNI=['ned','pon','tor','sre','čet','pet','sob'];
const fmtKg=n=>n?Number(n).toLocaleString('sl-SI'):'0';
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}

let db,root,me='',email='',day=new Date(),dayDoc=null,kupci=[],hist=[],unDay=null,pending=false;
day.setHours(0,0,0,0);
const dayId=()=>'d-'+ymd(day);
const isToday=()=>ymd(day)===ymd(new Date());

/* ------------ okno ------------ */
function openSheet(html){const was=!$('#ov').hidden;$('#sheet').innerHTML=html;$('#ov').hidden=false;$('#sheet').scrollTop=0;const x=$('#sheet .sx');if(x)x.onclick=closeSheet;if(!was){try{history.pushState({s:1},'')}catch(e){}}}
function closeSheet(back){if($('#ov').hidden)return;$('#ov').hidden=true;sheetKind='';curOne=null;if(back!==false){try{history.back()}catch(e){}}}
window.addEventListener('popstate',()=>{if(!$('#ov').hidden)closeSheet(false)});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});

/* ------------ zagon ------------ */
async function boot(){
  try{await loadScript(FB+'firebase-app-compat.js');await Promise.all([loadScript(FB+'firebase-auth-compat.js'),loadScript(FB+'firebase-firestore-compat.js')])}
  catch(e){$('#main').innerHTML='<div class="gate">Ni povezave. Poskusite znova, ko bo signal.</div>';return}
  firebase.initializeApp(CFG);db=firebase.firestore();
  try{db.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u||!u.emailVerified){$('#main').innerHTML='<div class="gate">Najprej se prijavite v aplikaciji <a href="index.html">Odprema</a>, nato se vrnite sem.</div>';return}
    email=u.email.toLowerCase();root=db.collection('skladista').doc(KOD);
    try{const c=await root.collection('clani').doc(email).get();if(c.exists)me=c.data().ime||'';}catch(e){}
    if(!me)me=email.split('@')[0];
    root.collection('slovenija').doc('kupci').onSnapshot(s=>{kupci=(s.exists&&s.data().list)||[];render();if(sheetKind==='kupci')openKupci();if(sheetKind==='add')openAdd()},e=>gateErr(e));
    root.collection('slovenija_hist').orderBy('kad','desc').limit(300).onSnapshot(s=>{hist=s.docs.map(d=>({id:d.id,...d.data()}));if(sheetKind==='hist')openHist()},()=>{});
    subDay();
  });
}
function gateErr(e){if(e&&e.code==='permission-denied')$('#main').innerHTML='<div class="gate">Pilot je zaenkrat samo za odpremnika.<br><br>(Če ste odpremnik: v Firebase še niso prilepljena nova pravila.)</div>'}
function subDay(){
  if(unDay)unDay();dayDoc=null;render();
  unDay=root.collection('slovenija').doc(dayId()).onSnapshot({includeMetadataChanges:true},s=>{pending=s.metadata.hasPendingWrites;dayDoc=s.exists?s.data():{};render();if(sheetKind==='one'&&curOne){const a=document.activeElement;if(a&&a.tagName==='INPUT'&&$('#sheet').contains(a))oneDirty=true;else openOne(curOne)}},e=>gateErr(e));
}
function dayRef(){return root.collection('slovenija').doc(dayId())}
function logH(txt,tip){root.collection('slovenija_hist').add({kad:Date.now(),ko:me,dan:ymd(day),txt,tip:tip||''}).catch(()=>{})}
function save(obj){dayRef().set(obj,{merge:true}).catch(e=>toast('Napaka: '+(e.message||e)))}

/* ------------ glavni zaslon ------------ */
function list(){const D=(dayDoc&&dayDoc.dostave)||{};return Object.entries(D).map(([id,x])=>({id,...x})).sort((a,b)=>(a.kad||0)-(b.kad||0))}
const done=x=>!!(x.st&&x.st.n);
const kupOf=x=>kupci.find(k=>k.id===x.kid);
const needW=x=>x.teza!==undefined?!!x.teza:!!((kupOf(x)||{}).teza);
const steps=x=>needW(x)?STEPS:STEPS.filter(s=>s[0]!=='t');
const ready=x=>!!x.st&&steps(x).every(([k])=>x.st[k]);
const palSl=n=>n+' '+(n%100===1?'paleta':n%100===2?'paleti':(n%100===3||n%100===4)?'palete':'palet');
function typesTxt(i){const a=[];if(i.e)a.push(i.e+'× EUR');if(i.x)a.push(i.x+'× navadna');if(i.h)a.push(i.h+'× ½');if(i.o)a.push(i.o+'× druga');return a.join(', ')}
let prevoznik=(()=>{try{return localStorage.getItem('slo_prev')||''}catch(e){return''}})();
const PT={e:['EUR','120×80'],x:['Navadna','120×80'],h:['½','60×80'],o:['dr.','']};
function pals(x){return Object.entries(x.palete||{}).map(([pid,v])=>({pid,...v})).sort((a,b)=>(a.o||0)-(b.o||0))}
function pinfo(x){const P=pals(x);if(!P.length)return{e:+x.pal||0,x:0,h:0,o:0,kg:+x.kg||0,n:+x.pal||0,miss:0,legacy:true};
  const r={e:0,x:0,h:0,o:0,kg:0,n:P.length,miss:0};P.forEach(p=>{r[p.t]=(r[p.t]||0)+1;if(+p.kg>0)r.kg+=+p.kg;else r.miss++});return r}
function pTxt(i){const a=[];if(i.e)a.push(i.e+' EUR');if(i.x)a.push(i.x+' nav.');if(i.h)a.push(i.h+' ½');if(i.o)a.push(i.o+' dr.');return a.join(' + ')||'– pal'}

function render(){
  const d=day;$('#dTxt').innerHTML=(isToday()?'Danes':DNI[d.getDay()].replace(/^./,c=>c.toUpperCase()))+', '+dmy(d)+'<small>'+(isToday()?DNI[d.getDay()]:'')+'</small>';
  const rg=$('#reg');if(document.activeElement!==rg)rg.value=(dayDoc&&dayDoc.regija)||'';
  if(!dayDoc){$('#main').innerHTML='<div class="empty">Nalagam …</div>';return}

  $('#sheet').querySelectorAll('[data-wt]').forEach(b=>b.onclick=()=>{const L2=kupci.map(k=>k.id===b.dataset.wt?{...k,teza:!k.teza}:k);const k=L2.find(z=>z.id===b.dataset.wt);
    root.collection('slovenija').doc('kupci').set({list:L2},{merge:true}).catch(e=>toast('Napaka: '+e.message));logH('Tehtanje '+(k.teza?'da':'ne')+' – kupec '+k.ime+' '+(k.kraj||''),'kup')});
  $('#sheet').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(!b.dataset.c){b.dataset.c=1;b.textContent='Res?';return}const k=kupci.find(x=>x.id===b.dataset.x);
    root.collection('slovenija').doc('kupci').set({list:kupci.filter(x=>x.id!==b.dataset.x)},{merge:true});if(k)logH('Odstranjen kupec: '+k.ime+' '+(k.kraj||''),'kup')});
  $('#nkA').onclick=()=>{const i=$('#nkI').value.trim(),k=$('#nkK').value.trim();if(!i){$('#nkI').focus();return}
    if(kupci.some(x=>x.ime.toLowerCase()===i.toLowerCase()&&(x.kraj||'').toLowerCase()===k.toLowerCase())){toast('Ta kupec je že na seznamu');return}
    root.collection('slovenija').doc('kupci').set({list:[...kupci,{id:uid(),ime:i,kraj:k,teza:!!($('#nkW')&&$('#nkW').checked)}]},{merge:true}).catch(e=>toast('Napaka: '+e.message));logH('Nov kupec: '+i+' '+k,'kup')};
}
/* ------------ zgodovina ------------ */
function openHist(){sheetKind='hist';let h='<h2>🕘 Zgodovina <button class="sx">✕</button></h2>';let cur='';
  if(!hist.length)h+='<p class="empty">Še ni zapisov.</p>';
  for(const x of hist){const d=dmy(new Date(x.kad));if(d!==cur){cur=d;h+='<div class="hday">'+(ymd(new Date(x.kad))===ymd(new Date())?'Danes':d)+'</div>'}
    h+='<div class="hi"><span class="t">'+hm(x.kad)+'</span><span>'+esc(x.txt)+' <span class="w">· '+esc(x.ko||'')+(x.dan&&x.dan!==ymd(new Date(x.kad))?' · za '+esc(x.dan.split('-').reverse().join('.')):'')+'</span></span></div>'}
  openSheet(h)}

boot();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='updated'&&$('#ov').hidden&&!pending)location.reload()})}
</script>

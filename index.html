const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function stopRec(){if(rec){try{rec.abort()}catch(e){}rec=null}}
function startVoice(){
  if(!ready()||noEdit())return;
  if(!SR){openType('',true);return}
  stopRec();
  openSheet('<div class="listen"><div class="pulse" id="pulseB">🎤</div><div class="big" id="live">'+t('listen')+'</div><p class="mut">'+t('vEx')+'</p><button class="btn p" id="doneB">'+t('done')+'</button><button class="btn" id="stopB">'+t('cancel')+'</button></div>','listen');
  $('#stopB').onclick=closeSheet;
  let got=false,last='',alts=[],quiet=0,maxT=0;
  const finish=()=>{if(got)return;got=true;clearTimeout(quiet);clearTimeout(maxT);const r=rec;rec=null;try{r&&r.abort()}catch(e){}
    if(last.trim())handleText(last,alts);else{closeSheet();toast(t('nothing'))}};
  $('#doneB').onclick=finish;$('#pulseB').onclick=finish;
  try{
    rec=new SR();rec.lang=LANG==='sl'?'sl-SI':'hr-HR';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=5;
    rec.onresult=e=>{let txt='';for(const r of e.results)txt+=r[0].transcript;last=txt;const l=$('#live');if(l)l.textContent=txt;
      alts=e.results.length===1?[...e.results[0]].map(a=>a.transcript):[];
      clearTimeout(quiet);
      if(e.results[e.results.length-1].isFinal){finish();return}
      quiet=setTimeout(finish,1300)}; // v hrupu: ko 1,3 s ni novih besed, zaključi
    rec.onerror=e=>{if(got)return;if(e.error==='not-allowed'||e.error==='service-not-allowed'){got=true;stopRec();openType('',true,t('micDenied'))}else if(e.error!=='aborted'){if(last.trim())finish();else{got=true;stopRec();openType('',true,t('notHeard'))}}};
    rec.onend=()=>{if(!got&&sheetState.type==='listen')finish()};
    maxT=setTimeout(finish,8000);
    rec.start();
  }catch(e){openType('',true,t('noVoice'))}
}
function resolveFirm(p,typed){
  if(!p||p.err||!p.fraw){if(p)p.cands=[];return p}
  const onLoc=new Set(locItems(p.lok).map(s=>norm(s.firma)));const needOn=p.move||p.clear||(p.delta<0);
  const ex=exactFirm(p.fraw);const c=firmCands(p.fraw,needOn?onLoc:null);
  p.cands=c.slice(0,4);p.lit=titleCase(p.fraw);
  if(ex){p.firma=ex;p.cands=p.cands.filter(x=>x!==ex);return p}
  if(typed){p.firma=p.lit}else{const sc=lastCandScores;p.firma=c[0]||p.lit;if(sc.length>1&&sc[1][1]-sc[0][1]<0.15){p.firma=null;p.needPick=true}}
  return p}
function handleText(txt,alts,typed){
  const ld=allLocData(),kf=knownFirms();
  const known=f=>!f||kf.some(k=>norm(k)===norm(f));
  let p=parseCommand(txt,allLocs(),kf,ld,t('noFirm'));
  if((p.err||!known(p.firma))&&alts)for(const a of alts){if(a===txt)continue;const q=parseCommand(a,allLocs(),kf,ld,t('noFirm'));if(!q.err&&(p.err||known(q.firma))){p=q;txt=a;if(known(q.firma))break}}
  if(p.err){openType(txt,false,t(p.err,p.arg));return}
  showConfirm(resolveFirm(p,typed),txt);
}

function buildReport(){
  const now=Date.now(),L=allLocs();
  const since=state.handover&&now-state.handover.kad<24*3600e3?state.handover.kad:now-12*3600e3;
  let txt=t('rTitle')+'\n'+fdt(now)+'\n'+t('rBy')+': '+(me||'?')+'\n\n';
  const empty=[],byF={};let tot=0;
  for(const l of L){const st=locItems(l);if(!st.length){empty.push(l);continue}
    const s=sumOf(st);tot+=s;st.forEach(x=>byF[x.firma]=(byF[x.firma]||0)+x.palete);
    txt+=l+': '+st.map(x=>fkT(x.firma,x.k)+' '+x.palete).join(', ')+(st.length>1?' ('+t('rTot')+' '+s+')':'')+'\n'}
  txt+='\n'+t('rEmpty')+' ('+empty.length+'): '+(empty.join(', ')||t('rNone'))+'\n';
  txt+='\n'+t('rByF')+':\n'+Object.entries(byF).sort((a,b)=>a[0].localeCompare(b[0])).map(([f,n])=>f+': '+n).join('\n')+'\n'+t('rAll')+': '+pal(tot)+'\n';
  const UU=undoneSet();const ch=state.hist.filter(x=>x.kad>=since&&!x.tip&&!UU.has(x.id)).reverse();
  txt+='\n'+t('rCh')+' '+fdt(since)+' ('+ch.length+'):\n'+(ch.map(x=>ft(x.kad)+' '+x.ko+' – '+(x.do?x.lok+' → '+x.do+' '+fkT(curName(x.firma),x.k)+' '+x.delta:x.lok+' '+fkT(curName(x.firma),x.k)+' '+(x.delta>0?'+':'')+x.delta+(x.opis?' ('+opisTxt(x)+')':''))).join('\n')||t('rNone'))+'\n';
  const om=openMsgList();if(om.length)txt+='\n'+t('rMsgs')+' ('+om.length+'):\n'+om.map(m=>'• '+(m.pom?'❗ ':'')+(m.odIme||'?')+' → '+msgTo(m)+(m.lok?' ['+m.lok+']':'')+': '+m.txt).join('\n')+'\n';
  return{txt,byF,tot,ch,since,now,om};
}

function chGroup(ch){const out=[];for(const x of ch){const L=out[out.length-1];
    if(L&&!x.do&&!x.opis&&!L.x.do&&!L.x.opis&&L.x.ko===x.ko&&L.x.lok===x.lok&&L.x.firma===x.firma&&(L.x.k||'')===(x.k||'')&&Math.sign(L.x.delta)===Math.sign(x.delta)&&x.kad-L.last<5*60e3){L.n++;L.sum+=x.delta;L.last=x.kad;continue}
    out.push({x,n:1,sum:x.delta,last:x.kad})}return out}

    (F.length?'<div class="pst">'+t('hoFirms')+'</div><div class="ptwo">'+F.map(([f,n])=>'<div><span>'+T(f)+'</span><b>'+n+'</b></div>').join('')+'</div>':'')+

      const what=x.do?T(x.lok)+' → '+T(x.do)+' '+F2:T(x.lok)+' '+F2+(g.n>1?' ('+g.n+'×)':'')+(x.opis?' · '+opisTxt(x):'');

    (r.om&&r.om.length?'<div class="pst">'+t('hoOpen')+'</div>'+r.om.map(m=>'<div class="pmsg">'+(m.pom?'❗ ':'')+T(m.txt)+(m.lok?' – '+T(m.lok):'')+' ('+T(m.odIme||'?')+')</div>').join(''):'')+

const dayStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime()};
const ymd=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dmy=ms=>{const d=new Date(ms);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()};
function periodRange(k){const now=Date.now(),t0=dayStart(now),D=864e5;const wd=(new Date(t0).getDay()+6)%7;
  if(k==='today')return[t0,t0+D];if(k==='yest')return[t0-D,t0];if(k==='week')return[t0-wd*D,t0+D];if(k==='lweek')return[t0-(wd+7)*D,t0-wd*D];
  if(k==='month'){const d=new Date(t0);d.setDate(1);return[d.getTime(),t0+D]}
  const a=$('#rFrom').value,b=$('#rTo').value;const fa=a?dayStart(a+'T00:00'):t0,fb=b?dayStart(b+'T00:00')+D:t0+D;return[fa,Math.max(fb,fa+D)]}

async function loadReport(){

function calcReport(){
  const rows=repState.rows||[];const U=new Set(rows.filter(x=>x.tip==='undo'&&x.ref).map(x=>x.ref));
  const fq=norm($('#rF').value||''),wq=$('#rW').value||'';
  const ok=rows.filter(x=>!x.tip&&!U.has(x.id)&&(!fq||norm(x.firma||'').includes(fq)||norm(curName(x.firma||'')).includes(fq))&&(!wq||x.ko===wq));
  const fixes=rows.filter(x=>x.tip==='undo').length;
  const T={in:0,out:0,mv:0,del:0},byF={},byW={},byD={};
  const add=(o,k,f,n)=>{o[k]=o[k]||{in:0,out:0,mv:0};o[k][f]+=n};
  for(const x of ok){if(x.opis==='d'){T.del+=Math.abs(x.delta);continue}const f=x.do?'mv':x.delta>0?'in':'out',n=Math.abs(x.delta);T[f]+=n;add(byF,curName(x.firma||'?'),f,n);add(byW,x.ko||'?',f,n);add(byD,ymd(x.kad),f,n)}
  return{ok,fixes,T,byF,byW,byD};
}
function repTable(title,obj,sortByName){const e=Object.entries(obj);if(!e.length)return'';e.sort(sortByName?(a,b)=>a[0].localeCompare(b[0]):(a,b)=>(b[1].in+b[1].out)-(a[1].in+a[1].out));
  return '<h3>'+title+'</h3><table class="rt"><tr><th></th><th>'+t('rIn')+'</th><th>'+t('rOut')+'</th><th>'+t('rMv')+'</th></tr>'+e.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td class="plus">'+(v.in||'')+'</td><td class="minus">'+(v.out||'')+'</td><td class="mv">'+(v.mv||'')+'</td></tr>').join('')+'</table>'}
function showReport(){
  const out=$('#rOut');if(!out||!repState.rows)return;const R=calcReport();
  const multi=repState.to-repState.from>864e5;const per=dmy(repState.from)+(multi?' – '+dmy(repState.to-1):'');

    const save=async(target,merge)=>{const np=clone(state.post);np.fi=np.fi||{};np.firme=np.firme||[];
      if(f&&f!==target){np.firme=np.firme.filter(x=>x!==f);delete np.fi[f];np.renames=np.renames||{};np.renames[f]=target;delete np.renames[target]}

  if(!ok)return;
  const lg={kad:Date.now(),ko:me,tip:'foto',n:files.length,naslov:subj};if(to.length)lg.za=to.length;
  try{doWrite([],[lg])}catch(e){}
  fotoReset();closeSheet();toast(to.length?t('fDoneTo'):t('fDone'))}
function openFotoSet(back){if(!canFoto())return;
  const L=clone(mailList()),V=[...vrste()];
  const draw=()=>{openSheet('<h2>⚙️ '+t('fSetT')+'</h2><h3>'+t('fAddr')+'</h3><p class="mut">'+t('fAddrH')+'</p>'+(L.length?L.map((m,i)=>'<div class="frow"><button class="fstar'+(m.def?' on':'')+'" data-st="'+i+'" aria-label="'+t('fDef')+'">'+(m.def?'★':'☆')+'</button><span>'+esc(m.e)+'</span><button class="spx" data-dx="'+i+'">✕</button></div>').join(''):'<p class="mut">'+t('fNoAddr')+'</p>')+
      '<div class="add"><input class="in" id="sNe" type="email" inputmode="email" placeholder="ime@podjetje.si" autocomplete="off"><button class="btn" id="sNa" style="margin:0;width:auto;padding:12px 16px">+</button></div>'+
      '<h3>'+t('fVrste')+'</h3><div class="ocs">'+V.map((v,i)=>'<span class="oc">'+esc(v)+' <button class="spx" data-vx="'+i+'">✕</button></span>').join('')+'</div><div class="add"><input class="in" id="sNv" placeholder="'+t('fNewV')+'" autocomplete="off"><button class="btn" id="sNva" style="margin:0;width:auto;padding:12px 16px">+</button></div>'+
      '<button class="btn p" id="sSv">'+t('save')+'</button><button class="btn" id="xB">'+t('back')+'</button>','fotoset');
    $('#xB').onclick=()=>back?openFoto(true):openSettings();
    $('#sheet').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const m=L[+b.dataset.st];m.def=!m.def;draw()});
    $('#sheet').querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{L.splice(+b.dataset.dx,1);draw()});
    $('#sheet').querySelectorAll('[data-vx]').forEach(b=>b.onclick=()=>{V.splice(+b.dataset.vx,1);draw()});
    $('#sNa').onclick=()=>{const e=$('#sNe').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e)){toast(t('fBadMail'));return}if(!L.some(m=>m.e===e))L.push({e,def:!L.length});draw()};
    $('#sNva').onclick=()=>{const v=$('#sNv').value.trim();if(v&&!V.some(x=>norm(x)===norm(v)))V.push(v);draw()};
    $('#sSv').onclick=async()=>{const np=clone(state.post);np.mailTo=L;np.fotoVrste=V;if(await run(store.savePost(np))){toast('✓');if(FS)FS.to=new Set([...FS.to].filter(e=>L.some(m=>m.e===e)).concat(L.filter(m=>m.def).map(m=>m.e)));back?openFoto(true):openSettings()}}};
  draw()}

/* ================= prisotnost ================= */
const presOn=()=>store.mode==='cloud'&&(isOwner()||myOnl);
function agoTxt(ts){if(!ts)return t('prNever');const n=Date.now(),m=Math.floor((n-ts)/60e3);if(m<1)return t('prNow');if(m<60)return t('prAgo',m);
  const d=new Date(ts),t0=new Date();t0.setHours(0,0,0,0);if(ts>=t0.getTime())return t('prToday',ft(ts));if(ts>=t0.getTime()-864e5)return t('prYday',ft(ts));return fdt(ts)}
function presOf(email){const p=(state.pris||{})[email];const on=!!p&&Date.now()-p.kad<210e3;return{on,kad:p&&p.kad}}
function presH(email){const P=presOf(email);return '<span class="pdot'+(P.on?' on':'')+'"></span>'+(P.on?'<b class="pon">'+t('prOn')+'</b>':'<span class="mut">'+t('prLast')+': '+agoTxt(P.kad)+'</span>')}
function onlineCount(){return state.clani.filter(c=>c.email!==myEmail&&presOf(c.email).on).length}
function midEmail(mid){const c=state.clani.find(x=>x.mid===mid);return c?c.email:null}
function midOnline(mid,ime){let e=midEmail(mid);if(!e){const k=Object.entries(state.pris||{}).find(([_,v])=>v.ime===ime);e=k&&k[0]}return e?presOf(e).on:false}
function updPres(){document.querySelectorAll('[data-pres]').forEach(e=>e.innerHTML=presH(e.dataset.pres));const s=$('#sMemOn');if(s){const n=onlineCount();s.textContent=n?' · 🟢 '+t('onN',n):''}}
setInterval(()=>{if(presOn())updPres()},30e3);

/* ================= sporočila ================= */
const msgOn=()=>store.mode==='cloud'&&!!myMid&&(isOwner()||mySadm||myMsg);
const msgAdm=()=>store.mode==='cloud'&&(isOwner()||mySadm);
const dirName=id=>{const d=(state.post.dir||[]).find(x=>x.id===id);return d?d.ime:'?'};
const isAdmMid=id=>(state.post.admMids||[]).includes(id);
function msgTo(m){return (m.za||[]).map(z=>z==='*'?t('mAll'):dirName(z)).join(', ')}
const forMe=m=>(m.za||[]).includes(myMid)||(m.za||[]).includes('*');
const isUnread=m=>!m.del&&m.od!==myMid&&forMe(m)&&!(m.brano||{})[myMid];
function openMsgList(){if(!msgOn())return[];return (state.msgs||[]).filter(m=>!m.del&&!m.done&&(msgAdm()||forMe(m)||m.od===myMid)).sort((a,b)=>a.kad-b.kad)}
let msgTab='o',msgCleaned=false;const popShown=new Set(),readSent=new Set();
function updMsg(){const b=$('#bMsg');if(!b)return;const on=msgOn();b.hidden=!on;if(!on)return;const n=(state.msgs||[]).filter(isUnread).length;$('#msgN').textContent=n?' '+n:'';b.classList.toggle('has',!!n);
  if(sheetState.type==='msgs')renderMsgs();
  if($('#ov').hidden&&me){const m=(state.msgs||[]).find(x=>x.pom&&isUnread(x)&&!popShown.has(x.id));if(m){popShown.add(m.id);showPop(m)}}
  if(isOwner()&&!msgCleaned&&(state.msgs||[]).length){msgCleaned=true;const old=Date.now()-90*864e5;(state.msgs||[]).filter(m=>(m.done||m.del)&&((m.del&&m.del.kad)||(m.done&&m.done.kad)||m.kad)<old).slice(0,60).forEach(m=>FireStore.msgDel(m.id).catch(()=>{}))}}
function msgCard(m,acts){
  const canDone=!m.done&&!m.del&&(msgAdm()||forMe(m));const canRe=!m.del&&m.od!==myMid&&(msgAdm()||isAdmMid(m.od));
  return '<div class="msg'+(m.pom?' imp':'')+(m.done?' dn':'')+(m.del?' dl':'')+(isUnread(m)?' nw':'')+'"><div class="mh">'+(m.pom?'❗ ':'')+'<b>'+esc(m.odIme||dirName(m.od))+'</b> → '+esc(msgTo(m))+'<span class="mut"> · '+fdt(m.kad)+'</span></div>'+
    '<div class="mt">'+esc(m.txt).replace(/\n/g,'<br>')+'</div>'+(m.lok?'<button class="lc" data-ml="'+esc(m.lok)+'">📍 '+esc(m.lok)+'</button>':'')+
    (m.done?'<div class="mut">✓ '+t('mDoneBy',esc(m.done.ime),fdt(m.done.kad))+'</div>':'')+(m.del?'<div class="err">🗑 '+t('mDelBy',esc(m.del.ime),fdt(m.del.kad))+'</div>':'')+
    (acts?'<div class="ma">'+(canDone?'<button class="fc ok" data-md="'+m.id+'">✓ '+t('mDone')+'</button>':'')+(m.done&&!m.del&&msgAdm()?'<button class="fc" data-mo="'+m.id+'">↺ '+t('mReopen')+'</button>':'')+(canRe?'<button class="fc" data-mr="'+m.id+'">↩ '+t('mReply')+'</button>':'')+(msgAdm()&&!m.del?'<button class="fc" data-mx="'+m.id+'">🗑</button>':'')+'</div>':'')+'</div>'}
function wireMsg(el,back){
  const G=id=>(state.msgs||[]).find(x=>x.id===id);
  el.querySelectorAll('[data-ml]').forEach(b=>b.onclick=()=>openLoc(b.dataset.ml));
  el.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>run(FireStore.msgSet(b.dataset.md,{done:{ime:me,kad:Date.now()}})).then(()=>toast('✓')));
  el.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>run(FireStore.msgSet(b.dataset.mo,{done:null})));
  el.querySelectorAll('[data-mr]').forEach(b=>b.onclick=()=>openMsgForm(G(b.dataset.mr)));
  el.querySelectorAll('[data-mx]').forEach(b=>b.onclick=()=>ask(t('mDelQ'),async()=>{await run(FireStore.msgSet(b.dataset.mx,{del:{ime:me,kad:Date.now()}}));back()},back))}
function showPop(m){
  openSheet('<h2>❗ '+t('mImp')+'</h2>'+msgCard(m,false)+'<button class="btn p" id="pOk">✓ '+t('mRead')+'</button><button class="btn" id="pAll">💬 '+t('mAllB')+'</button>','pop');
  wireMsg($('#sheet'),closeSheet);const rd=()=>FireStore.msgRead(m.id).catch(()=>{});
  $('#pOk').onclick=()=>{rd();closeSheet()};$('#pAll').onclick=()=>{rd();openMessages()}}
function openMessages(){if(!msgOn())return;
  const tabs=[['o','mOpen'],['d','mDoneT']].concat(isOwner()?[['x','mDelT']]:[]);if(!tabs.some(x=>x[0]===msgTab))msgTab='o';
  openSheet('<h2>💬 '+t('msgT')+'</h2><button class="btn p" id="mNew">✏️ '+t('mNewB')+'</button><div class="seg" id="mSeg">'+tabs.map(([k,l])=>'<button data-k="'+k+'" class="'+(msgTab===k?'on':'')+'">'+t(l)+'</button>').join('')+'</div><div id="mList"></div><button class="btn" id="xB">'+t('close')+'</button>','msgs');
  $('#xB').onclick=goBack;$('#mNew').onclick=()=>openMsgForm(null);
  $('#mSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{msgTab=b.dataset.k;$('#mSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderMsgs()});
  renderMsgs()}
function renderMsgs(){const el=$('#mList');if(!el)return;
  const L=(state.msgs||[]).filter(m=>msgTab==='x'?!!m.del:(!m.del&&(msgTab==='d'?!!m.done:!m.done))).filter(m=>msgAdm()||forMe(m)||m.od===myMid).sort((a,b)=>b.kad-a.kad);
  el.innerHTML=L.length?L.map(m=>msgCard(m,true)).join(''):'<p class="mut">'+t('mNone')+'</p>';wireMsg(el,openMessages);
  const un=L.filter(m=>isUnread(m)&&!readSent.has(m.id));if(un.length)setTimeout(()=>un.forEach(m=>{readSent.add(m.id);FireStore.msgRead(m.id).catch(()=>{})}),1500)}
function openMsgForm(re){
  const D=state.post.dir||[];const opts=msgAdm()?[['*',t('mAll')],...D.filter(d=>d.msg&&d.id!==myMid).map(d=>[d.id,(presOn()&&midOnline(d.id,d.ime)?'🟢 ':'')+d.ime+(d.adm?' ★':'')])]:D.filter(d=>d.adm&&d.id!==myMid).map(d=>[d.id,d.ime]);
  if(!opts.length){toast(t('mNoRcp'));return}
  openSheet('<h2>✏️ '+(re?t('mReply'):t('mNewB'))+'</h2>'+(re?'<div class="msg">'+'<div class="mt mut">'+esc(re.txt).slice(0,200)+'</div></div>':'')+'<label>'+t('mTo')+'</label><select class="in" id="mZa">'+opts.map(([v,l])=>'<option value="'+esc(v)+'"'+(re&&re.od===v?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'+
    '<label>'+t('mTxt')+'</label><textarea class="in" id="mTx" maxlength="2000"></textarea><label>'+t('mLok')+'</label><select class="in" id="mLk"><option value="">—</option>'+allLocs().map(l=>'<option'+(re&&re.lok===l?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'+
    '<label class="chk big2"><input type="checkbox" id="mPm">❗ '+t('mImpC')+'</label><button class="btn p" id="mSend">'+t('mSend')+'</button><button class="btn" id="mX">'+t('cancel')+'</button>','msgf');
  $('#mX').onclick=openMessages;
  $('#mSend').onclick=async()=>{const txt=$('#mTx').value.trim();if(!txt){$('#mTx').focus();return}$('#mSend').disabled=true;
    const o={od:myMid,odIme:me,za:[$('#mZa').value],txt,pom:$('#mPm').checked,kad:Date.now(),brano:{}};const lk=$('#mLk').value;if(lk)o.lok=lk;if(re)o.re=re.id;
    const pr=FireStore.msgSend(o);toast(t('mSent'));openMessages();pr.catch(e=>toast(t('error')+(e.message||e)))};
}

/* ================= zagon ================= */
$('#bMsg').onclick=openMessages;$('#bFoto').onclick=()=>openFoto(true);$('#bkOv').onclick=()=>{if(retOver!==null)backToOver()};
$('#bMic').onclick=startVoice;$('#bType').onclick=()=>openType('',true);$('#bHist').onclick=openHist;$('#bRep').onclick=openReport;$('#bSet').onclick=()=>openSettings();$('#bOver').onclick=openOver;
$('#meChip').onclick=()=>store.mode==='cloud'?openSettings():pickProfile();
(async function boot(){
  applyLang();
  {const im=new Image();im.onload=()=>{$('#logoBox').innerHTML='<img src="logo.png" alt="">'};im.src='logo.png'}
  const m=location.hash.match(/cfg=([^&]+)/);
  if(m){try{LS.set('lk_cfg',JSON.parse(decodeURIComponent(escape(atob(m[1])))))}catch(e){}history.replaceState(null,'',location.pathname+location.search)}
  try{const pv=LS.get('lk_ver',null);if(pv!==APP_VER){LS.set('lk_ver',APP_VER);if(pv)setTimeout(()=>toast(t('verNew',APP_VER)),1500)}}catch(e){}
  const cfg=getCfg();
  if(!cfg){setSync('off');LocalStore.init(render);if(!me)pickProfile();return}
  me=null;setSync('wait');store=PendingStore;
  const c=LS.get('lk_cache',null);
  if(c&&c.post){Object.assign(state,{post:{...clone(DEFAULT_POST),...c.post},lok:c.lok||{},hist:c.hist||[],handover:c.handover||null,vlasnik:c.vlasnik||null});me=c.me;myEmail=c.email;myRole=c.myRole||'radnik';applyRole()}
  render();
  try{if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('message',e=>{if(e.data!=='updated')return;const rl=()=>{if(!$('#ov').hidden||(store.mode==='cloud'&&Object.keys(FireStore.pend||{}).length)){setTimeout(rl,3000);return}location.reload()};toast(t('updated'));setTimeout(rl,1500)});let swR=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(swR)return;swR=true})}}catch(e){}
  try{await FireStore.load(cfg)}catch(e){setSync('err',e.message);toast(t('notConn')+e.message);setTimeout(()=>location.reload(),15000);return}
  firebase.auth().onAuthStateChanged(u=>{
    if(!u){FireStore.stop();myEmail=null;me=null;myRole='radnik';store=LocalStore;state.lok={};state.hist=[];state.clani=[];LS.del('lk_cache');render();showLogin();return}
    if(!u.emailVerified){showVerify(u);return}
    afterLogin(u);
  });
})();
</script>
